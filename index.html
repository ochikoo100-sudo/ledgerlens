<title>Ledger &amp; Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Special+Elite&display=swap">
<style>
/* Layout: a single 880px column, like a case file on a ledger-ruled desk. The office map is a grid of manila folders grouped by act. */
:root{
  --paper:#E6ECE4; --sheet:#F8FAF6; --ink:#17211C; --muted:#56655C; --rule:#CAD6CC;
  --accent:#B3302A; --good:#2B6A4A; --manila:#E2CD96; --manila-ink:#4A3D17; --shade:rgba(23,33,28,.08); --bar:#17211C; --bar-ink:#E6ECE4;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-type:"Special Elite","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1411; --sheet:#151F1A; --ink:#E3EAE2; --muted:#93A499; --rule:#26342C;
  --accent:#E35A4F; --good:#5BBE8C; --manila:#6F6033; --manila-ink:#F3E6BF; --shade:rgba(0,0,0,.35); --bar:#060A08; --bar-ink:#E3EAE2; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1411; --sheet:#151F1A; --ink:#E3EAE2; --muted:#93A499; --rule:#26342C;
  --accent:#E35A4F; --good:#5BBE8C; --manila:#6F6033; --manila-ink:#F3E6BF; --shade:rgba(0,0,0,.35); --bar:#060A08; --bar-ink:#E3EAE2; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;padding:0;color:inherit}
.brand span{color:var(--accent)}
.topstats{margin-left:auto;display:flex;gap:14px;font:600 13px var(--f-mono);flex-wrap:wrap;align-items:center}
.topstats b{color:var(--manila)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.05;margin:0;letter-spacing:.01em}
h1{font-size:clamp(38px,7vw,60px);font-weight:900;text-transform:uppercase}
h2{font-size:30px;font-weight:800;text-transform:uppercase}
h3{font-size:22px;font-weight:800}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.typed{font-family:var(--f-type)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:0 2px 0 var(--shade),0 10px 30px var(--shade);padding:22px;min-width:0}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);padding:10px 18px;font-weight:600;border-radius:2px;transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:14px}

/* Office */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:28px;align-items:stretch}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
.badge{position:relative;background:var(--manila);color:var(--manila-ink);padding:20px;border-radius:4px;box-shadow:0 10px 30px var(--shade)}
.badge .clip{position:absolute;top:-10px;left:50%;width:56px;height:18px;margin-left:-28px;border-radius:4px;background:var(--ink);opacity:.85}
.badge .nm{font-family:var(--f-type);font-size:24px;margin:6px 0 2px;word-break:break-word}
.badge .rk{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase}
.bar{height:10px;background:color-mix(in srgb,var(--manila-ink) 18%,transparent);border-radius:5px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--manila-ink)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.medal{font:600 11px var(--f-mono);border:1.5px solid currentColor;padding:2px 7px;border-radius:20px;opacity:.35}
.medal.on{opacity:1}
.act{margin-top:40px}
.act-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:16px;flex-wrap:wrap}
.act-head .num{font-family:var(--f-display);font-size:44px;font-weight:900;color:var(--accent);line-height:.8}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 16px}
.folder{position:relative;text-align:left;border:0;background:var(--manila);color:var(--manila-ink);padding:16px 14px 14px;border-radius:0 4px 4px 4px;min-height:150px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 color-mix(in srgb,var(--manila-ink) 25%,transparent);transition:transform .12s}
.folder::before{content:attr(data-tab);position:absolute;top:-18px;left:0;height:18px;padding:0 10px;background:var(--manila);border-radius:4px 4px 0 0;font:600 11px/18px var(--f-mono);letter-spacing:.08em}
.folder:hover:not(:disabled){transform:translateY(-3px) rotate(-.4deg)}
.folder .ft{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.05;text-transform:uppercase}
.folder .fc{font-size:13px;opacity:.8}
.folder .fs{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font:600 12px var(--f-mono)}
.folder:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.folder.done::after{content:"CLOSED";position:absolute;right:8px;top:10px;font-family:var(--f-type);color:var(--accent);border:2px solid var(--accent);padding:0 6px;transform:rotate(8deg);font-size:13px}
.stars{letter-spacing:2px;font-size:15px}
.stars .on{color:var(--accent)}
.side-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:600px){.side-cards{grid-template-columns:1fr}}

/* Case */
.casehead{margin-top:24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.track{display:flex;gap:4px;margin:18px 0;flex-wrap:wrap}
.track span{flex:1 1 90px;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-top:4px solid var(--rule);color:var(--muted)}
.track span.now{border-color:var(--accent);color:var(--ink)}
.track span.past{border-color:var(--ink);color:var(--ink)}
.hook{font-family:var(--f-type);font-size:18px;line-height:1.6;border-left:4px solid var(--accent);padding-left:16px}
.evidence{position:relative}
.evidence .tag{position:absolute;top:-12px;right:16px;background:var(--accent);color:#fff;font:600 12px var(--f-mono);padding:3px 10px;letter-spacing:.08em}
.evidence .body{font-size:17px;max-width:65ch}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.q{font-size:19px;font-weight:500;max-width:65ch;margin:10px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--rule);padding:12px 14px;border-radius:2px;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font:600 13px var(--f-mono);border:1.5px solid currentColor;width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--sheet))}
.opt.wrong{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--sheet))}
.opt.gone{opacity:.25;text-decoration:line-through}
.calcrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.numin{font:600 22px var(--f-mono);padding:10px 12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);width:min(260px,100%);border-radius:2px}
.unit{font:600 15px var(--f-mono);color:var(--muted)}
.fb{margin-top:16px;padding:14px 16px;border:2px dashed var(--rule);display:flex;gap:14px;align-items:flex-start}
.fb .mark{font-family:var(--f-type);font-size:34px;line-height:1;flex:none}
.fb.ok .mark{color:var(--good)} .fb.no .mark{color:var(--accent)}
.fb p{margin:0}
.hint{margin-top:10px;font-size:14px;background:color-mix(in srgb,var(--manila) 45%,transparent);padding:8px 12px}
.exhibit{overflow-x:auto;margin-bottom:14px}
.exhibit table{border-collapse:collapse;font:14px var(--f-mono);font-variant-numeric:tabular-nums;min-width:280px}
.exhibit td{padding:4px 12px;border-bottom:1px solid var(--rule)}
.exhibit td:last-child{text-align:right}
.chip{font:600 12px var(--f-mono);padding:3px 9px;border:1.5px solid var(--ink);border-radius:20px}
.chip.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.timer{height:8px;background:var(--rule);margin:10px 0 4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.timer.low i{background:var(--accent)}
.boss-banner{background:var(--bar);color:var(--bar-ink);padding:14px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.boss-banner h3{color:var(--bar-ink)}

/* Sort board */
.pile{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:2px dashed var(--rule);margin-bottom:14px}
.item{background:var(--sheet);border:1.5px solid var(--ink);padding:7px 11px;font-size:14px;border-radius:2px;text-align:left;box-shadow:2px 2px 0 var(--shade)}
.item.sel{background:var(--ink);color:var(--sheet)}
.item.right{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.item.wrong{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bin{border:2px solid var(--ink);background:var(--paper);min-height:150px;display:flex;flex-direction:column}
.bin>button.binh{border:0;background:var(--ink);color:var(--sheet);font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;padding:8px 10px;text-align:left}
.bin .slot{display:flex;flex-direction:column;gap:6px;padding:8px;flex:1}
.bin.over{outline:3px solid var(--accent)}

/* Results */
.stamp{display:inline-block;font-family:var(--f-type);font-size:clamp(40px,9vw,72px);color:var(--accent);border:6px double var(--accent);padding:4px 22px;transform:rotate(-7deg);margin:18px 0;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
.stamp.fail{color:var(--muted);border-color:var(--muted)}
@keyframes stamp{from{transform:scale(2.6) rotate(-16deg);opacity:0}to{transform:scale(1) rotate(-7deg);opacity:1}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{border-top:3px solid var(--ink);padding-top:6px}
.stat b{display:block;font:600 28px var(--f-mono)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,15,12,.6);display:grid;place-items:center;padding:16px}
.modal[hidden],[hidden]{display:none!important}
.modal .sheet{max-width:640px;width:100%;max-height:85vh;overflow:auto}
.promo{text-align:center}
.promo .rk{font-family:var(--f-display);font-weight:900;font-size:40px;text-transform:uppercase;color:var(--accent)}
.cardlist{display:grid;gap:14px}
.cardlist div{border-left:3px solid var(--accent);padding-left:12px}

/* ---------- v2: motion, suspects, duel ---------- */
.rise{animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{transform:translateY(24px) rotate(-1.5deg);opacity:.001}to{transform:none;opacity:1}}
.slidein{animation:slidein .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes slidein{from{transform:translateX(28px);opacity:.001}to{transform:none;opacity:1}}
.flipin{animation:flipin .55s cubic-bezier(.2,.9,.3,1.1) both;transform-origin:left center}
@keyframes flipin{from{transform:perspective(900px) rotateY(-75deg);opacity:.001}to{transform:none;opacity:1}}
.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pop{animation:pop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.quake{animation:quake .35s}
@keyframes quake{0%,100%{transform:none}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
.fx{position:fixed;pointer-events:none;z-index:40;left:0;top:0}
.spark{width:8px;height:8px;border-radius:2px}
.floattxt{font:700 18px var(--f-mono);white-space:nowrap;text-shadow:0 1px 0 var(--sheet)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:39;background:var(--accent);opacity:0;animation:flash .45s}
@keyframes flash{0%{opacity:.28}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;z-index:45;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:10px 18px;font:600 14px var(--f-mono);border-left:5px solid var(--accent);animation:toast 2.6s both;max-width:calc(100% - 32px)}
@keyframes toast{0%{transform:translate(-50%,40px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,20px);opacity:0}}
.iconbtn{background:none;border:1.5px solid currentColor;color:inherit;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;padding:0;opacity:.85}
.iconbtn svg{width:18px;height:18px}

/* combo meter */
.combo{display:flex;align-items:center;gap:8px;font:600 12px var(--f-mono)}
.combo .meter{width:90px;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.combo .meter i{display:block;height:100%;background:var(--manila-ink);transition:width .3s}
.combo.hot .meter i{background:var(--accent)}
.combo.hot span{color:var(--accent)}

/* suspect */
.suspect{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.sus{width:72px;height:72px;flex:none;animation:bob 3.2s ease-in-out infinite}
.sus.big{width:120px;height:120px}
.sus [data-m]{display:none}
.sus.mood-smug [data-m~="smug"],.sus.mood-nervous [data-m~="nervous"],.sus.mood-panic [data-m~="panic"],.sus.mood-busted [data-m~="busted"]{display:inline}
.sus.mood-panic{animation:tremble .12s linear infinite}
.sus.hit{animation:hit .45s}
.sus .drop{animation:drip 1.3s ease-in infinite}
.sus .drop2{animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes hit{0%{transform:none;filter:none}20%{transform:translateX(10px) rotate(6deg);filter:brightness(1.6)}60%{transform:translateX(-5px) rotate(-3deg)}100%{transform:none}}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.bubble{position:relative;background:var(--paper);border:2px solid var(--ink);padding:8px 12px;border-radius:12px;min-width:0;flex:1;font-family:var(--f-type);font-size:15px;min-height:48px}
.bubble::before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble b{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.escape{animation:escape .9s ease-in forwards}
@keyframes escape{to{transform:translateX(140%) rotate(12deg);opacity:0}}

/* duel */
.duel{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--bar);color:var(--bar-ink);padding:16px 18px}
.duel h3{color:var(--bar-ink)}
.duel .sus-bg{background:color-mix(in srgb,var(--bar-ink) 10%,transparent);border-radius:50%;padding:4px}
.hp{height:16px;background:color-mix(in srgb,var(--bar-ink) 18%,transparent);margin-top:8px;position:relative;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#E8964A);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.hp span{position:absolute;inset:0;font:600 11px/16px var(--f-mono);padding-left:6px;color:#fff;letter-spacing:.06em}
.hearts{display:flex;gap:6px;margin-top:10px;align-items:center;font:600 12px var(--f-mono)}
.heart{width:20px;height:18px}
.heart path{fill:var(--accent)}
.heart.lost path{fill:none;stroke:color-mix(in srgb,var(--bar-ink) 40%,transparent);stroke-width:2}
.heart.breaking{animation:hbreak .6s}
@keyframes hbreak{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-12deg)}100%{transform:scale(1)}}
@media (max-width:520px){.duel{grid-template-columns:1fr;justify-items:start}}

/* board extras */
.board{position:relative}
.string{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.string path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .4s ease-out forwards;opacity:.85}
@keyframes draw{to{stroke-dashoffset:0}}
.pin{position:absolute;top:8px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent);box-shadow:0 2px 0 rgba(0,0,0,.35);z-index:3}
.folder.next{outline:3px dashed var(--accent);outline-offset:4px}
.flame{display:inline-block;width:14px;height:18px;vertical-align:-3px}
.flame path{fill:var(--accent)}
.flame.cold path{fill:var(--muted)}
.side-cards.four{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:600px){.side-cards.four{grid-template-columns:1fr}}
.note-ch{border-top:2px solid var(--ink);padding-top:10px}
.note-ch.locked .fl{filter:blur(4px);user-select:none}
.fl{display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:4px 14px;font-size:14px;margin-top:8px}
.fl dt{font-weight:600}
.fl dd{margin:0;font-family:var(--f-mono);font-size:13px}
@media (max-width:560px){.fl{grid-template-columns:1fr}.fl dd{margin-bottom:6px}}
.unlock-note{background:color-mix(in srgb,var(--manila) 55%,transparent);padding:8px 14px;font:600 13px var(--f-mono)}

/* ---------- multiplayer ---------- */
.firm{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:20px}
@media (max-width:700px){.firm{grid-template-columns:1fr}}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb-row{display:grid;grid-template-columns:28px auto 1fr auto;gap:10px;align-items:center;padding:7px 10px;background:var(--paper);border:1px solid var(--rule)}
.lb-row.me{border:2px solid var(--accent)}
.lb-row.gone{opacity:.5}
.lb-pos{font:700 16px var(--f-mono);text-align:center}
.top1 .lb-pos{color:#B8860B}.top2 .lb-pos{color:#8A8F98}.top3 .lb-pos{color:#A0592B}
.lb.big .top1{background:color-mix(in srgb,var(--manila) 50%,var(--paper))}
.lb-av{width:30px;height:30px;border-radius:50%;background:var(--rule);display:block;object-fit:cover}
.lb-av.sm{width:24px;height:24px}
.lb-name{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.lb-name b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-val{font:700 16px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.lb-val small{display:block;font:500 10px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.online-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule)}
.online-row:last-child{border-bottom:0}
.online-row .lb-name{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 0 var(--good);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.btn.sm{padding:4px 12px;font-size:14px}
.tabs{gap:6px}
.tab{border:2px solid var(--ink);background:transparent;padding:6px 14px;font:600 13px var(--f-mono);border-radius:20px}
.tab.on{background:var(--ink);color:var(--sheet)}
.sel{align-self:flex-start;min-width:120px;font:500 15px var(--f-body);padding:9px 10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:2px;max-width:100%}
.code{font-family:var(--f-mono);background:var(--ink);color:var(--sheet);padding:0 12px;letter-spacing:.12em;text-transform:none}
.lob-players{display:flex;flex-wrap:wrap;gap:10px}
.lob-p{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);padding:8px 14px;background:var(--paper)}
.taunts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tbtn{background:var(--sheet);cursor:pointer}
.tbtn:hover{background:var(--ink);color:var(--sheet)}
.countdown{font:900 clamp(120px,30vw,220px)/1 var(--f-display);text-align:center;margin-top:60px;color:var(--accent)}
.race{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;margin-top:24px;align-items:start}
@media (max-width:760px){.race{grid-template-columns:1fr}}
.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);padding:14px}
.live .lb-row{grid-template-columns:24px 1fr auto}
.prog{display:block;height:5px;background:var(--rule);margin:4px 0 2px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,140px));gap:10px;align-items:end;justify-content:center;width:100%;margin:6px 0 10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod span{font:600 14px var(--f-mono)}
.pod .blk{width:100%;background:var(--ink);color:var(--sheet);font:900 34px var(--f-display);display:grid;place-items:center;animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both}
.pod.p1 .blk{height:130px;background:var(--accent);color:#fff;animation-delay:.5s}
.pod.p2 .blk{height:95px;animation-delay:.25s}
.pod.p3 .blk{height:70px}

.picker-tools{gap:6px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.pk{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--rule);background:var(--paper);padding:6px 8px;font-size:13px;line-height:1.25;border-radius:2px;min-width:0}
.pk b{font:700 13px var(--f-mono);width:24px;height:24px;display:grid;place-items:center;border:1.5px solid currentColor;border-radius:50%;flex:none}
.pk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk.on{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.chat{display:flex;flex-direction:column;gap:8px}
.chat-log{max-height:220px;min-height:70px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--paper);border:1px solid var(--rule)}
.msg{display:flex;flex-direction:column;max-width:85%;align-self:flex-start;background:var(--sheet);border:1px solid var(--rule);padding:5px 9px;border-radius:10px 10px 10px 2px;animation:slidein .25s both}
.msg.mine{align-self:flex-end;background:var(--ink);color:var(--sheet);border-color:var(--ink);border-radius:10px 10px 2px 10px}
.msg b{font:600 11px var(--f-mono);opacity:.75}
.msg span{word-break:break-word;font-size:14px}
.chat-f{display:flex;gap:6px}
.chat-in{flex:1;min-width:0;font:15px var(--f-body);padding:8px 10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:2px}
.chat-d summary{cursor:pointer;font:600 13px var(--f-mono);margin-bottom:8px}
.live .chat-log{max-height:160px}
.invite{border-top:1px dashed var(--rule);padding-top:10px}

/* ---------- exam sections ---------- */
.scen{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--manila-ink);margin-top:12px}
.scen summary{cursor:pointer;padding:8px 14px;font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.scen-body{padding:0 16px 12px;max-width:75ch}
.scen-body p{margin:.5em 0}
.sc-t{border-collapse:collapse;font:14px var(--f-mono);font-variant-numeric:tabular-nums;margin:8px 0;min-width:260px}
.sc-t th,.sc-t td{padding:4px 10px;border-bottom:1px solid var(--rule);text-align:right}
.sc-t th:first-child{text-align:left;font-family:var(--f-body);font-weight:500}
.scen-body,.cbe-scen{overflow-x:auto}
.pf{display:grid;gap:6px}
.pf-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:4px 12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--rule)}
.pf-row label{font-size:15px}
.pf-fb{grid-column:1/-1;font-size:13px}
.pf-fb:empty{display:none}
.pf-in{width:100%;font-size:17px;padding:6px 8px}
.pf-in.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--paper))}
.pf-in.no{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--paper))}
.mk{font:600 11px var(--f-mono);color:var(--muted);border:1px solid var(--rule);padding:0 5px;border-radius:8px}
.good{color:var(--good)}.bad{color:var(--accent)}
.pts{display:grid;gap:8px}
.pt{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:8px 10px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer}
.pt input{margin-top:4px}.pt span{flex:1;min-width:0}.pt small{flex-basis:100%;padding-left:24px}
.pt.vok{border-color:var(--good)}.pt.vno{border-color:var(--accent)}
.exam-cards{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))!important}
.side-cards.four{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.folder.sen{background:color-mix(in srgb,var(--manila) 70%,var(--sheet))}
/* report */
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(0,240px) 1fr 70px;gap:10px;align-items:center;font-size:14px}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{height:12px;background:var(--rule);overflow:hidden}
.bt i{display:block;height:100%;animation:grow .8s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
.bt i.hi{background:var(--good)}.bt i.mid{background:#C98A1B}.bt i.lo{background:var(--accent)}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.bv{font:600 13px var(--f-mono);text-align:right}
.recs{margin:0;padding-left:20px;display:grid;gap:8px}
@media (max-width:560px){.bar-row{grid-template-columns:1fr 60px}.bt{grid-column:1/-1;order:3}.pf-row{grid-template-columns:1fr}}
/* flashcards */
.fcard{position:relative;max-width:620px;margin:24px auto 0;min-height:260px;perspective:1200px}
.fface{position:absolute;inset:0;background:var(--sheet);border:2px solid var(--ink);padding:26px;display:flex;flex-direction:column;gap:10px;justify-content:center;backface-visibility:hidden;transition:transform .55s cubic-bezier(.2,.9,.3,1);box-shadow:0 10px 30px var(--shade);overflow:auto}
.fface.back{transform:rotateY(180deg)}
.fcard.flipped .front{transform:rotateY(-180deg)}.fcard.flipped .back{transform:rotateY(0)}
.fb-body{font-size:17px;max-width:60ch}
/* CBE exam screen */
body.cbe-mode{background-image:none}
.cbe{margin-top:16px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-body)}
.cbe-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#1F3B5A;color:#fff;padding:8px 14px;font-size:14px}
.cbe-time{margin-left:auto;font:600 16px var(--f-mono);background:rgba(255,255,255,.12);padding:2px 10px}
.cbe-time.low{background:#B3302A}
.cbe-main{display:grid;grid-template-columns:minmax(0,1fr) 210px;min-height:380px}
.cbe-q{padding:18px;border-right:1px solid var(--rule);min-width:0}
.cbe-nav{padding:14px;display:flex;flex-direction:column;gap:10px}
.nvg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nv{border:1px solid var(--rule);background:var(--paper);font:600 12px var(--f-mono);padding:5px 0;border-radius:2px;position:relative;display:inline-block;min-width:20px;min-height:14px}
.nv.ans{background:#DCE8F5;border-color:#1F3B5A;color:#1F3B5A}
.nv.flag::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#C98A1B}
.nv.cur{outline:2px solid #1F3B5A;outline-offset:1px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend i{width:14px;height:12px;margin-right:4px;vertical-align:-2px}
.cbe-foot{display:flex;gap:8px;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--rule);flex-wrap:wrap}
.cbe-opts{display:grid;gap:8px}
.cbe-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);background:var(--paper);cursor:pointer}
.cbe-opt:has(input:checked){border-color:#1F3B5A;background:#DCE8F5;color:#13263A}
.cbe-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.cbe-scen{background:var(--paper);border:1px solid var(--rule);padding:4px 14px;font-size:14px;max-height:70vh;overflow:auto}
.rv{margin-top:10px}.rv.ok{border-left:4px solid var(--good)}.rv.no{border-left:4px solid var(--accent)}
@media (max-width:760px){.cbe-main,.cbe-split{grid-template-columns:1fr}.cbe-q{border-right:0;border-bottom:1px solid var(--rule)}.cbe-scen{max-height:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <button class="brand" id="homeBtn" type="button">Ledger <span>&amp;</span> Lens</button>
  <div class="topstats" id="topstats"></div>
</div></header>
<main class="wrap" id="app"></main>

function makeServer(base){
  const wsURL=base.replace(/^http/,'ws').replace(/\/$/,'')+'/ws';
  let ws=null,welcomed=false,myPeer=null,uid=null,reqId=0;const pending=new Map(),rooms=new Map();let boardCb=null,lastBoard=null;
  let tok=null;try{uid=localStorage.getItem('ll-srv-uid');tok=localStorage.getItem('ll-srv-token')}catch(e){}
  let readyRes;let ready=new Promise(r=>readyRes=r);
  const sendRaw=m=>{if(ws&&ws.readyState===1&&(welcomed||m.t==='hello'))ws.send(JSON.stringify(m))};
  const call=m=>new Promise(res=>{const id=++reqId;pending.set(id,res);sendRaw(Object.assign({id},m));setTimeout(()=>{if(pending.has(id)){pending.delete(id);res(null)}},8000)});
  function snap(R){return R.list.map(x=>Object.freeze({peer:x.peer,by:x.by,isMe:x.peer===myPeer,sameTab:x.peer===myPeer,kind:'viewer',guest:false,presence:Object.freeze(x.peer===myPeer?Object.assign({},R.mine):(x.p||{})),updatedAt:Date.now()}))}
  function notify(R){const s=snap(R),prev=new Set(R.last.map(p=>p.peer)),now=new Set(s.map(p=>p.peer));const joined=s.filter(p=>!prev.has(p.peer)),left=R.last.filter(p=>!now.has(p.peer));R.last=s;R.ph.slice().forEach(h=>{try{h({peers:s,joined,left,updated:s})}catch(e){}})}
  function connect(){
    try{ws=new WebSocket(wsURL)}catch(e){return setTimeout(connect,3000)}
    ws.onopen=()=>ws.send(JSON.stringify({t:'hello',uid,token:tok}));
    ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.t==='welcome'){welcomed=true;myPeer=m.peer;uid=m.uid;tok=m.token;try{localStorage.setItem('ll-srv-uid',uid);localStorage.setItem('ll-srv-token',tok)}catch(e){}
        rooms.forEach((R,name)=>{sendRaw({t:'join',room:name});if(Object.keys(R.mine).length)sendRaw({t:'presence',room:name,p:R.mine})});if(boardCb)sendRaw({t:'board.sub'});readyRes(true);return}
      if((m.t==='res'||m.t==='joinres')&&pending.has(m.id)){const f=pending.get(m.id);pending.delete(m.id);f(m);return}
      if(m.t==='peers'){const R=rooms.get(m.room);if(R){R.list=Array.isArray(m.list)?m.list:[];notify(R)}return}
      if(m.t==='event'){const R=rooms.get(m.room);if(R)(R.th[m.topic]||[]).slice().forEach(h=>{try{h({topic:m.topic,data:m.data,peer:m.from,by:m.by,isMe:m.from===myPeer,sameTab:m.from===myPeer,kind:'viewer',guest:false})}catch(e){}});return}
      if(m.t==='board'){lastBoard=m.list;if(boardCb)boardCb(m.list)}};
    ws.onclose=()=>{welcomed=false;rooms.forEach(R=>{R.list=R.list.filter(x=>x.peer===myPeer);notify(R)});setTimeout(connect,2500)};
    ws.onerror=()=>{};
  }
  function roomAPI(name){
    if(!rooms.has(name))rooms.set(name,{list:[],last:[],ph:[],th:{},mine:{}});const R=rooms.get(name);
    return{name,
      presence:async p=>{R.mine=Object.assign({},R.mine,p);Object.keys(R.mine).forEach(k=>R.mine[k]===null&&delete R.mine[k]);if(!R.list.some(x=>x.peer===myPeer)&&myPeer)R.list=R.list.concat([{peer:myPeer,by:uid,p:{}}]);notify(R);sendRaw({t:'presence',room:name,p:R.mine})},
      emit:async(topic,data)=>{sendRaw({t:'emit',room:name,topic,data})},
      on:(t,h)=>{(R.th[t]=R.th[t]||[]).push(h);return()=>{const a=R.th[t],i=a.indexOf(h);if(i>-1)a.splice(i,1)}},
      peers:()=>snap(R),onPeers:h=>{R.ph.push(h);setTimeout(()=>{const s=snap(R);h({peers:s,joined:s,left:[],updated:[]})},0);return()=>{const i=R.ph.indexOf(h);if(i>-1)R.ph.splice(i,1)}},
      connected:()=>!!(ws&&ws.readyState===1&&welcomed),onConnection:h=>{setTimeout(()=>h(!!welcomed),0);return()=>{}},
      leave:async()=>{sendRaw({t:'leave',room:name});rooms.delete(name)}}}
  connect();
  const lobby=roomAPI('lobby');
  const room=Object.assign({},lobby,{join:async name=>{await ready;const r=await call({t:'join',room:name});if(!r||r.err)throw{code:r&&r.err||'upstream_error',message:'join failed'};return roomAPI(name)}});
  ready.then(()=>sendRaw({t:'join',room:'lobby'}));
  const user={me:async()=>{await ready;return{id:uid,name:'',avatarUrl:'',color:'#888',email:null,isOwner:false,canEdit:false}},id:async()=>{await ready;return uid},
    profiles:async ids=>Object.fromEntries([].concat(ids).map(i=>[i,{id:i,name:'',avatarUrl:'',color:'#888',email:null,isMe:i===uid,guest:false}])),isOwner:async()=>false,canEdit:async()=>false,can:async()=>true};
  const db={doc:path=>({
      get:async()=>{if(/^data\/users\/[^/]+\/profile$/.test(path)){const r=await call({t:'save.get'});const d=r&&r.data;return{id:'profile',exists:!!d,data:()=>d?{save:d}:undefined,metadata:{}}}return{id:path.split('/').pop(),exists:false,data:()=>undefined,metadata:{}}},
      set:async data=>{if(/^data\/users\/[^/]+\/profile$/.test(path))return void await call({t:'save.set',data:data.save});if(/^players\/[^/]+$/.test(path))return void await call({t:'player.set',data})}}),
    collection:name=>{const q={orderBy:()=>q,limit:()=>q,onSnapshot(next){boardCb=list=>next({docs:list.map(p=>({id:p.id,exists:true,data:()=>p,metadata:{}})),size:list.length,empty:!list.length,docChanges:()=>[]});ready.then(()=>sendRaw({t:'board.sub'}));if(lastBoard)boardCb(lastBoard);return()=>{boardCb=null}}};return q}};
  return{room,user,db,ready};
}
const base=window.LL_SERVER||(/^https?:/.test(location.protocol)?location.origin:null);
const pick=(async()=>{
  if(base){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),4000);const r=await fetch(base.replace(/\/$/,'')+'/api/ping',{signal:ctl.signal});clearTimeout(t);const j=await r.json();
    if(j&&j.game==='ledger-lens'){const s=makeServer(base);const ok=await Promise.race([s.ready,new Promise(r=>setTimeout(()=>r(false),6000))]);if(ok){window.__SERVER=base;return s}}}catch(e){}}
  if(typeof Peer!=='undefined'){window.__P2P=true;return makeP2P()}
  return{room:null,user:null,db:null};
})();
window.claude={use:async n=>{const api=await pick;return api[n]||null}};
})();

{ch:5,act:1,title:'Impairment of Assets',client:'Glassmere Hotels',
hook:'A flood swept through Glassmere’s flagship hotel and bookings collapsed, yet the accounts show the assets at full value. Find the hidden losses.',
cards:[
 ['The test','An asset is impaired when its <b>carrying amount > recoverable amount</b>. Recoverable amount = the <b>higher</b> of fair value less costs of disposal and <b>value in use</b> (the present value of future cash flows).'],
 ['Spot the indicators','<b>External:</b> a significant fall in market value, adverse changes in technology, market or law, rising interest rates, market capitalisation below net assets. <b>Internal:</b> obsolescence or physical damage, restructuring, worse performance than expected. Goodwill and indefinite-life intangibles are tested every year regardless.'],
 ['Booking the loss','Charge it to P/L. For a <b>revalued asset</b>, treat it as a revaluation decrease: use up that asset’s revaluation surplus first, then charge the rest to P/L.'],
 ['Cash-generating units','If one asset doesn’t generate independent cash flows, test its <b>CGU</b>. Allocate the loss: (1) damaged or destroyed assets, (2) goodwill, (3) other assets pro rata on carrying amount.']
],
mcq:[
 M('Recoverable amount is…',['The lower of FV less costs of disposal and value in use','The higher of FV less costs of disposal and value in use','Always fair value','Always value in use'],1,'Higher of the two. A rational owner would sell or use, whichever gives more.'),
 M('Which is an EXTERNAL indicator of impairment?',['Physical damage','A plan to restructure','A significant rise in market interest rates','Worse performance than budget'],2,'Interest rates are outside the entity. Higher rates reduce value in use.'),
 M('In a CGU, after writing down specifically damaged assets, the loss is allocated next to…',['Inventory','Goodwill','Land','All assets pro rata'],1,'Goodwill comes next, then other assets pro rata.'),
 M('Which asset must be tested for impairment annually even with no indicators?',['A delivery van','Goodwill','Inventory','Trade receivables'],1,'Goodwill (and indefinite-life intangibles) need an annual test.')
],
calc:[
 C('A hotel has a carrying amount of $500,000. Fair value less costs of disposal is $380,000 and value in use is $420,000. What is the impairment loss?',80000,'Recoverable amount = higher of 380,000 and 420,000 = 420,000. Loss = 500,000 − 420,000 = $80,000.'),
 C('A CGU has goodwill $50,000, building $300,000 and plant $150,000. Recoverable amount is $400,000. What is the building’s carrying amount after the impairment?',266667,'Loss = 100,000. Goodwill takes 50,000. The remaining 50,000 is split pro rata over 450,000: building 300/450 × 50,000 = 33,333. Building = 300,000 − 33,333 = $266,667.',{h:'Goodwill absorbs the loss first.'}),
 C('A revalued asset has a carrying amount of $200,000, with a revaluation surplus of $30,000 relating to it. Recoverable amount is $150,000. How much of the loss goes to P/L?',20000,'Total loss 50,000. 30,000 goes against the surplus (OCI) and the remaining $20,000 goes to P/L.')
],
sort:{p:'Internal or external impairment indicator?',bins:['Internal','External'],items:[['Physical damage from the flood',0],['Plans to restructure the division',0],['Performance worse than expected',0],['Asset is obsolete',0],['Market value has fallen sharply',1],['Market interest rates have risen',1],['Adverse change in the legal environment',1],['Market capitalisation below net assets',1]]},
boss:[
 C('Carrying amount $90,000. FV less costs of disposal $72,000. Value in use $65,000. What is the impairment loss?',18000,'Recoverable amount = 72,000 (the higher). Loss = 90,000 − 72,000 = $18,000.'),
 M('How is an impairment loss on a revalued asset treated?',['Always to P/L','As a revaluation decrease (surplus first, then P/L)','Always to OCI in full','Directly to retained earnings'],1,'It is treated as a revaluation decrease.'),
 M('Value in use is…',['Market value','Present value of the future cash flows from the asset','Replacement cost','Net book value'],1,'Value in use is the discounted future cash flows.'),
 C('A CGU has goodwill $40,000, plant $120,000 and machinery $40,000. Recoverable amount is $140,000. What is the plant’s carrying amount after the impairment?',105000,'Loss 60,000. Goodwill takes 40,000. The other 20,000 is split over 160,000: plant 120/160 × 20,000 = 15,000. Plant = $105,000.'),
 M('A CGU is…',['Any group of assets','The smallest identifiable group of assets generating largely independent cash inflows','The whole company','Only goodwill and land'],1,'That is the IAS 36 definition.')
]},
// ---------------- CH 6 ----------------
{ch:6,act:1,title:'Revenue',client:'Skylark Telecom & Orbit Builders',
hook:'Two clients, one suspicion: revenue is being booked too early. Skylark bundles phones with contracts, and Orbit builds stadiums over years. Apply IFRS 15 and follow the money.',
cards:[
 ['The 5 steps','1. Identify the contract. 2. Identify the separate <b>performance obligations</b>. 3. Determine the transaction price. 4. Allocate the price to the obligations (by relative <b>standalone selling prices</b>). 5. Recognise revenue when (or as) each obligation is satisfied.'],
 ['Control is king','Revenue is recognised when <b>control</b> passes to the customer. It is recognised <b>over time</b> if the customer receives and consumes the benefit as you perform, OR your work creates an asset the customer controls, OR the asset has no alternative use and you have an enforceable right to payment. Otherwise it is recognised at a point in time.'],
 ['Contracts over time','Measure progress (output methods such as surveys of work done, or input methods such as costs incurred ÷ total costs). If the contract is expected to make a <b>loss</b>, recognise the whole loss immediately. Show a contract asset or liability.'],
 ['Tricky deals','<b>Agent:</b> recognise only the commission. <b>Consignment:</b> no revenue until the consignee sells. <b>Sale and repurchase</b> at a higher price: a financing arrangement, not a sale. <b>Bill-and-hold:</b> revenue only when the customer has control.'],
 ['IAS 20 government grants','Recognise when there is reasonable assurance the conditions will be met and the grant received. Grants related to assets: <b>deferred income</b> released over the asset’s life, OR deducted from the asset’s cost. Income grants are matched with the related costs.']
],
mcq:[
 M('Step 3 of the IFRS 15 model is…',['Identify the contract','Determine the transaction price','Allocate the price','Recognise revenue'],1,'Step 3 is determining the transaction price.'),
 M('What must transfer before revenue can be recognised?',['Legal title','Cash','Control','Risk only'],2,'Control of the goods or services is what matters under IFRS 15.'),
 M('Skylark sells another company’s insurance and earns a 10% commission. Skylark is an agent. Its revenue is…',['The gross insurance premium','The 10% commission only','Nothing until year end','The premium less costs'],1,'Agents recognise only their fee or commission.'),
 M('Orbit sells land for $1m and must buy it back next year for $1.1m. This is…',['A sale with a $0.1m gain later','A financing arrangement (a loan)','A lease','Revenue of $1.1m'],1,'Being obliged to repurchase at a higher price makes it a financing arrangement.')
],
calc:[
 C('Skylark sells a phone plus a 2-year service plan for $1,200. Standalone prices: phone $600, service $900. How much revenue is allocated to the PHONE?',480,'1,200 × 600 ÷ (600 + 900) = $480. This is recognised on delivery.'),
 C('Orbit has a $10m contract (satisfied over time). Costs to date are $3m and further costs are expected to be $5m. Progress is measured by costs. How much revenue is recognised to date?',3750000,'Progress = 3 ÷ 8 = 37.5%. Revenue = 37.5% × 10m = $3,750,000.'),
 C('A $5m contract is expected to cost $6m in total and is 40% complete. What total loss must be recognised in P/L now?',1000000,'Expected losses are recognised in full immediately: $1,000,000.'),
 C('A $600,000 government grant is received for a machine with a 5-year life (deferred income method). How much grant income is released each year?',120000,'600,000 ÷ 5 = $120,000 a year, matched with the machine’s depreciation.')
],
sort:{p:'Is revenue recognised at a point in time or over time?',bins:['Point in time','Over time'],items:[['Supermarket sale of groceries',0],['Online laptop sale delivered to the customer',0],['Sale of a used car at a dealership',0],['12-month office cleaning contract',1],['Building an extension on the customer’s land',1],['Annual software support service',1]]},
boss:[
 M('Which is the correct order?',['Contract, obligations, price, allocate, recognise','Price, contract, allocate, obligations, recognise','Contract, price, obligations, recognise, allocate','Obligations, contract, price, allocate, recognise'],0,'Contract → obligations → price → allocate → recognise.'),
 C('A $30m contract has costs to date of $12m and total expected costs of $24m. What is the PROFIT recognised to date (cost-based progress)?',3000000,'Progress 50%. Revenue 15m − costs 12m = $3,000,000.'),
 M('Goods sent on consignment to a dealer are recognised as revenue when…',['They are shipped to the dealer','The dealer sells them to a third party','The invoice is raised','The year ends'],1,'The consignor keeps control until the dealer sells them.'),
 M('Two methods for asset-related government grants are…',['Expense it or capitalise it','Deferred income, or deduct from the asset’s carrying amount','Credit to OCI or equity','Credit to revenue or to a provision'],1,'IAS 20 allows deferred income or deduction from the asset.'),
 C('A bundle sells for $900. Standalone prices are product A $400, B $300, C $500. How much revenue is allocated to C?',375,'900 × 500 ÷ 1,200 = $375.')
]},
// ---------------- CH 7 ----------------
{ch:7,act:2,title:'Introduction to Groups',client:'Marlowe Group',
hook:'Marlowe owns stakes in a dozen companies and claims none of them “really count”. Map the empire: who is controlled, who is influenced, and who is just an investment.',
cards:[
 ['Control (IFRS 10)','An investor controls an investee when it has (1) <b>power</b> over it, (2) exposure or rights to <b>variable returns</b>, and (3) the ability to use its power to affect those returns. Usually more than 50% of votes, but control is possible with less (for example, the right to appoint a majority of the board).'],
 ['The family tree','<b>Subsidiary</b> (control) → consolidate. <b>Associate</b> (significant influence, presumed at 20%+) → equity method. <b>Simple investment</b> → IFRS 9. Joint ventures → equity method.'],
 ['One economic entity','Consolidated statements present the parent and its subsidiaries as a <b>single entity</b>. Use uniform accounting policies and a common reporting date. In the parent’s OWN statements, the investment is held at cost or under IFRS 9.'],
 ['Exemptions & exclusions','A parent need not consolidate if it is itself a wholly-owned subsidiary (or partly owned and the NCI don’t object), its securities are not publicly traded, and its ultimate parent publishes IFRS group accounts. Excluding a subsidiary happens very rarely, and <b>never because its activities are different</b>.'],
 ['Non-controlling interest','The equity in a subsidiary <b>not attributable</b> to the parent, such as the 20% owned by outsiders in an 80% subsidiary.']
],
mcq:[
 M('Marlowe owns 30% of Pike Co but has the right to appoint the majority of Pike’s board. Pike is…',['An associate','A subsidiary','A simple investment','A joint venture'],1,'Power over the board gives control, so Pike is a subsidiary despite the 30% holding.'),
 M('Marlowe owns 25% of Wren Co and takes part in its policy decisions. Wren is…',['A subsidiary','An associate','Excluded','A trade investment'],1,'Significant influence makes Wren an associate (equity method).'),
 M('Marlowe (a manufacturer) controls a small bank. Should the bank be consolidated?',['No, its activities are dissimilar','Yes, dissimilar activities are not a reason to exclude','Only if profitable','Only in the notes'],1,'All subsidiaries are consolidated. Differences are dealt with by segment disclosures.'),
 M('In Marlowe’s OWN separate statements, an investment in a subsidiary is held at…',['Equity method only','Cost, or in accordance with IFRS 9','Fair value through OCI only','Net assets'],1,'Cost or IFRS 9 in the separate statements.')
],
calc:[
 C('Marlowe owns 75% of Tarn Co. Tarn’s profit for the year is $400,000. What share is attributable to the non-controlling interest?',100000,'25% × 400,000 = $100,000.')
],
sort:{p:'Classify each holding.',bins:['Subsidiary','Associate','Simple investment'],items:[['80% of voting shares',0],['45% plus an agreement giving majority voting power',0],['100% of shares',0],['35% with a board seat and policy influence',1],['22% participating in policy decisions',1],['5% with no influence',2],['12% held for short-term trading',2],['15% with no board representation or influence',2]]},
boss:[
 M('When can control be assumed?',['When the investor owns 20%','When it has power, exposure to variable returns and the ability to use power to affect returns','When it has a board seat','When it receives dividends'],1,'All three elements of IFRS 10 must be present.'),
 M('What does IFRS 10 require of a parent?',['Separate accounts only','Consolidated financial statements presenting the group as a single entity','Equity accounting for all investees','Proportionate consolidation'],1,'The parent and subsidiaries are combined as one entity.'),
 M('A non-controlling interest is…',['The parent’s share of a subsidiary','Equity in a subsidiary not attributable to the parent','An associate','A minority loan'],1,'That is the IFRS 10 definition.'),
 M('Which is NOT a condition for exemption from preparing consolidated statements?',['The parent is itself a wholly-owned subsidiary','Its securities are not publicly traded','Its ultimate parent publishes IFRS group accounts','The subsidiary is loss-making'],3,'Losses are irrelevant to exemption.'),
 C('Marlowe owns 60% of Fen Co. Fen’s net assets are $2,500,000. What is the NCI’s proportionate share of net assets?',1000000,'40% × 2,500,000 = $1,000,000.')
]},

{ch:8,act:2,title:'The Consolidated Statement of Financial Position',client:'Atlas & Tern Holdings',
hook:'Atlas bought 80% of Tern. Their junior accountant just added the two balance sheets together, and the auditors are furious. Rebuild the group SOFP properly.',
cards:[
 ['Basic method','Add the parent and subsidiary assets and liabilities <b>100%</b>, line by line. Cancel the parent’s investment against the subsidiary’s equity at acquisition. Eliminate intra-group receivables and payables. Show NCI within equity.'],
 ['Goodwill','<b>Goodwill = consideration transferred + NCI at acquisition − fair value of identifiable net assets.</b> Consideration includes cash, shares at fair value, deferred consideration at <b>present value</b> and contingent consideration at fair value. Acquisition costs (such as legal fees) are expensed.'],
 ['NCI: two ways','NCI at acquisition can be measured at <b>fair value</b> (gives higher, “full” goodwill) or at the <b>proportionate share</b> of net assets. Year-end NCI = NCI at acquisition + NCI% × post-acquisition reserves − NCI share of impairment (fair value method only).'],
 ['Group retained earnings','Parent’s RE + parent% × subsidiary’s <b>post-acquisition</b> RE (after adjustments) − group share of goodwill impairment − PURP (if the parent is the seller).'],
 ['PURP','Profit on intra-group sales still held in inventory is <b>unrealised</b> and must be removed. Mark-up on cost: profit = sales × mark-up ÷ (100 + mark-up). Margin: profit = sales × margin%. If the subsidiary sold, the PURP is shared with the NCI.'],
 ['Fair value adjustments','The subsidiary’s net assets are brought in at fair value at acquisition. Extra depreciation on a fair value uplift reduces post-acquisition profits.']
],
mcq:[
 M('Legal fees of $50,000 incurred on the acquisition are…',['Added to goodwill','Expensed to P/L','Deducted from equity','Capitalised as an intangible'],1,'Under IFRS 3, acquisition-related costs are expensed.'),
 M('Deferred consideration payable in 2 years is measured at…',['Its full nominal amount','Its present value at the acquisition date','Nil until paid','Fair value at the payment date'],1,'Discount it to present value.'),
 M('Tern (an 80% subsidiary) sold goods to Atlas at a profit. Some are still in inventory. The PURP is deducted from…',['Atlas’s retained earnings only','Tern’s post-acquisition profits (so shared with the NCI)','Goodwill','Revenue in the SOFP'],1,'The seller’s profits are adjusted. If the subsidiary sold, the NCI bears its share.'),
 M('Measuring NCI at fair value rather than at its proportionate share usually gives…',['Lower goodwill','Higher goodwill','The same goodwill','Negative goodwill'],1,'Fair value NCI includes goodwill attributable to the NCI.')
],
calc:[
 C('Atlas paid $800,000 for 80% of Tern. NCI at fair value was $190,000. Tern’s net assets at fair value at acquisition were $700,000. What is goodwill?',290000,'800,000 + 190,000 − 700,000 = $290,000.'),
 C('Same deal, but NCI is measured at its proportionate share of net assets. What is goodwill?',240000,'NCI = 20% × 700,000 = 140,000. Goodwill = 800,000 + 140,000 − 700,000 = $240,000.'),
 C('Tern sells to Atlas at cost plus 25%. At the year end Atlas holds $50,000 of these goods (at transfer price). What is the PURP?',10000,'50,000 × 25 ÷ 125 = $10,000.',{h:'Mark-up is on cost, so divide by 125.'}),
 C('Atlas’s RE is $1,000,000. Tern’s RE is $500,000 at the year end and was $200,000 at acquisition. Atlas owns 80%. Goodwill impairment is $20,000 (NCI at proportionate share). What are group retained earnings?',1220000,'1,000,000 + 80% × (500,000 − 200,000) − 20,000 = $1,220,000.'),
 C('NCI at acquisition (fair value) was $190,000. Tern’s post-acquisition profits are $150,000 and the NCI holds 20%. There is no impairment. What is NCI at the year end?',220000,'190,000 + 20% × 150,000 = $220,000.')
],
sort:{p:'Part of the consideration, or an expense?',bins:['Part of the consideration','Expense to P/L'],items:[['Cash paid to the seller',0],['Parent’s shares issued (at market value)',0],['Deferred cash (at present value)',0],['Contingent consideration (at fair value)',0],['Legal fees on the acquisition',1],['Due diligence adviser fees',1]]},
boss:[
 C('Atlas buys 60,000 of Tern’s shares for $600,000 cash plus 1 Atlas share for every 2 Tern shares acquired. Atlas shares are worth $5. What is the total consideration?',750000,'60,000 ÷ 2 = 30,000 shares × $5 = 150,000. Total = 600,000 + 150,000 = $750,000.'),
 C('$242,000 is payable 2 years after acquisition. The discount rate is 10%. What is the deferred consideration at acquisition?',200000,'242,000 ÷ 1.10² = $200,000.'),
 C('At acquisition, Tern’s plant had a fair value $100,000 above its carrying amount, with a remaining life of 5 years. By how much are post-acquisition profits reduced after 2 years?',40000,'Extra depreciation = 100,000 ÷ 5 × 2 = $40,000.'),
 C('Atlas sells to Tern at a 20% MARGIN. Tern holds $30,000 of these goods at the year end. What is the PURP?',6000,'30,000 × 20% = $6,000.'),
 M('Goodwill is always positive.',['True','False'],1,'False. A bargain purchase gives negative goodwill, which is a gain in P/L.')
]},

{ch:9,act:2,title:'The Consolidated Statement of Profit or Loss',client:'Atlas & Tern Holdings',
hook:'The balance sheet is fixed, but the group profit figure looks suspiciously high. Atlas has been “selling” to Tern and counting it twice. Strip it back.',
cards:[
 ['Line by line','Add the parent and subsidiary 100% from revenue down to profit for the year. Then split the profit between <b>owners of the parent</b> and <b>NCI</b> as a one-line allocation at the end.'],
 ['Intra-group trading','Deduct intra-group sales from BOTH revenue and cost of sales. Add any PURP to <b>cost of sales</b>, which reduces gross profit.'],
 ['Mid-year acquisitions','Include only the subsidiary’s <b>post-acquisition</b> results. Time-apportion its revenue and expenses (for example, acquired 1 April with a 31 Dec year end means 9/12).'],
 ['Cancel internal flows','Dividends and interest paid by the subsidiary to the parent are removed. The group cannot earn income from itself.'],
 ['NCI share of profit','NCI% × (the subsidiary’s profit after tax − PURP if the subsidiary sold − extra fair value depreciation − impairment if NCI is at fair value).'],
 ['Disposals','A subsidiary sold during the year is included in P/L <b>up to the disposal date</b>. Nothing is shown for it in the year-end SOFP.']
],
mcq:[
 M('Where does unrealised profit on intra-group trading appear in the consolidated P/L?',['Added to revenue','Added to cost of sales (reducing gross profit)','Added to finance costs','In OCI'],1,'PURP increases cost of sales.'),
 M('Tern paid Atlas a $50,000 dividend. In the consolidated P/L, this is…',['Investment income','Eliminated','Shown in OCI','Added to NCI'],1,'Intra-group dividends cancel out.'),
 M('A subsidiary is acquired on 1 October and the year ends 31 December. How many months of its results are included?',['12','9','3','0'],2,'Only the 3 post-acquisition months.'),
 M('A subsidiary sold during the year appears in the year-end SOFP at…',['Its net assets','Nothing','Cost','Fair value'],1,'It is not owned at the year end, so no amount is shown.')
],
calc:[
 C('Atlas revenue is $5,000,000 and Tern revenue $2,000,000. Intra-group sales were $400,000. What is consolidated revenue?',6600000,'5,000,000 + 2,000,000 − 400,000 = $6,600,000.'),
 C('Tern’s profit after tax is $600,000 and the NCI holds 30%. Tern sold goods to Atlas leaving PURP of $20,000, and extra fair value depreciation is $40,000. What is the NCI share of profit?',162000,'30% × (600,000 − 20,000 − 40,000) = 30% × 540,000 = $162,000.'),
 C('At the start of the year a 75% subsidiary transfers a non-current asset to its parent for $500,000. The asset’s carrying amount was $400,000 and it has 4 years of life left. What is the net charge to consolidated P/L at the year end?',75000,'Unrealised profit 100,000 less excess depreciation 25,000 (100,000 ÷ 4) = $75,000.')
],
sort:{p:'Eliminate on consolidation, or keep in group P/L?',bins:['Eliminate','Keep'],items:[['Sales from Tern to Atlas',0],['Dividend income Atlas receives from Tern',0],['Interest on a loan from Atlas to Tern',0],['Sales to outside customers',1],['Interest on the external bank loan',1],['Wages of Tern’s staff',1]]},
boss:[
 C('Cost of sales: Atlas $3,000,000, Tern $1,500,000. Intra-group sales were $500,000 and PURP is $25,000. What is consolidated cost of sales?',4025000,'3,000,000 + 1,500,000 − 500,000 + 25,000 = $4,025,000.'),
 C('A subsidiary was acquired on 1 September (year end 31 December). Its full-year profit is $1,200,000, earned evenly. The NCI is 25%. What is the NCI share of profit?',100000,'Post-acquisition profit = 4/12 × 1,200,000 = 400,000. NCI = 25% × 400,000 = $100,000.'),
 C('Atlas revenue is $6m and Tern’s full-year revenue $3m (earned evenly). Tern was acquired on 1 April (year end 31 Dec). Post-acquisition intra-group sales were $250,000. What is consolidated revenue?',8000000,'6m + 9/12 × 3m − 0.25m = 6m + 2.25m − 0.25m = $8,000,000.'),
 M('In the consolidated P/L, the NCI is shown…',['As an expense above operating profit','As an allocation of profit after tax at the end','In finance costs','Only in the notes'],1,'Profit attributable to owners of the parent and to the NCI is shown at the bottom.'),
 M('The consolidated statement of profit or loss and OCI is built from…',['The SOFP','The individual statements of profit or loss of the group companies','Cash flows','The parent only'],1,'It is built from the individual statements of the group companies.')
]},

{ch:10,act:2,title:'Accounting for Associates',client:'Marlowe Group',
hook:'Marlowe’s 30% stake in Corvid Ltd is shown at original cost from 5 years ago, even though Corvid has boomed. Bring it up to date with the equity method.',
cards:[
 ['Significant influence','The power to <b>participate</b> in financial and operating policy decisions, without control. It is presumed at 20% or more. Evidence: board representation, policy participation, material transactions, interchange of managers, essential technical information.'],
 ['Equity method: SOFP','Investment in associate = <b>cost + group share of post-acquisition retained earnings − impairment</b>. Dividends received reduce the investment.'],
 ['Equity method: P/L','One line: <b>share of profit of associate</b> (the group % of its profit AFTER tax), less any impairment. Do not add the associate’s revenue or expenses line by line.'],
 ['Trading with an associate','Do NOT eliminate sales or balances. Eliminate only the <b>group share</b> of unrealised profit. If the parent sold: Dr cost of sales, Cr investment in associate. If the associate sold: Dr share of profit of associate, Cr inventory.'],
 ['Separate statements','In the investor’s own accounts, the associate is held at cost or under IFRS 9.']
],
mcq:[
 M('In the consolidated P/L, an associate appears as…',['100% of its revenue and costs','The group share of its profit after tax, in one line','Dividends received only','Its share of revenue'],1,'One line: share of profit after tax.'),

 M('Marlowe sells goods to Corvid. In the group accounts, sales to Corvid are…',['Eliminated in full','Not eliminated, but the group share of PURP is removed','Eliminated at 30%','Moved to OCI'],1,'Associates are outside the group. Only the group share of PURP is removed.'),

],
calc:[

 C('Corvid’s profit after tax is $300,000 and Marlowe holds 25%. What is Marlowe’s share of profit of associate (before any PURP)?',75000,'25% × 300,000 = $75,000.'),
 C('Marlowe (25%) sold goods to Corvid. Corvid’s year-end inventory includes $40,000 of profit on those goods. How much PURP is eliminated?',10000,'Group share only: 25% × 40,000 = $10,000.')
],
sort:{p:'Subsidiary treatment or associate treatment?',bins:['Subsidiary','Associate'],items:[['Add 100% of revenue line by line',0],['Recognise a non-controlling interest',0],['Eliminate intra-group sales in full',0],['One line: share of profit after tax',1],['Investment shown as a single asset line',1],['Remove only the group share of PURP',1]]},
boss:[
 C('Cost $1,000,000 for 40%. Post-acquisition profits of the associate are $500,000. Cumulative impairment is $50,000. What is the carrying amount of the investment?',1150000,'1,000,000 + 40% × 500,000 − 50,000 = $1,150,000.'),
 M('Significant influence is presumed when the holding is…',['Over 50%','20% or more','Exactly 10%','Any board seat, whatever the holding'],1,'The IAS 28 presumption is 20% or more.'),
 M('If the ASSOCIATE sells to the parent and the parent still holds the goods, the PURP entry is…',['Dr Cost of sales, Cr Investment in associate','Dr Share of profit of associate, Cr Inventory','Dr Revenue, Cr Cost of sales','No entry'],1,'The inventory is in the group, so credit inventory.'),
 M('Joint ventures in the consolidated accounts are…',['Consolidated in full','Equity accounted','Held at cost','Proportionately consolidated'],1,'Joint ventures use the equity method under IAS 28.'),
 C('An associate’s profit after tax is $800,000 and the group holds 30%. Impairment for the year is $40,000. What is the share of profit of associate in P/L?',200000,'30% × 800,000 − 40,000 = $200,000.')
]},

{ch:11,act:3,title:'Financial Instruments',client:'Quillon Capital',
hook:'Quillon reports “preference shares” as equity and calls a convertible bond pure debt. Its gearing looks suspiciously low. Expose the substance.',
cards:[
 ['Definitions','A <b>financial instrument</b> gives rise to a financial asset of one entity and a financial liability or equity instrument of another. <b>Financial liability:</b> a contractual obligation to deliver cash or another financial asset. <b>Equity:</b> a residual interest after all liabilities.'],
 ['Substance over form','<b>Redeemable</b> preference shares are a liability, and their dividends are a finance cost. Irredeemable, non-cumulative preference shares are equity.'],
 ['Compound instruments','A convertible bond is split. <b>Liability</b> = PV of the cash flows discounted at the market rate for similar debt WITHOUT conversion. <b>Equity</b> = proceeds − liability.'],
 ['Liabilities at amortised cost','Initial amount = proceeds − issue costs. Each year: + interest at the <b>effective rate</b>, − cash paid (coupon). Discounts, premiums and issue costs are spread through the effective interest.'],
 ['Financial assets (IFRS 9)','<b>Amortised cost:</b> held to collect contractual cash flows that are solely principal and interest. <b>FVTOCI:</b> debt held to collect and sell, or an irrevocable election for equity not held for trading. <b>FVTPL:</b> everything else (such as held-for-trading shares). Initial measurement is fair value + transaction costs (costs are expensed for FVTPL).'],
 ['Derecognition','Derecognise when the rights to the cash flows expire, or when substantially all the risks and rewards are transferred.']
],
mcq:[
 M('Redeemable preference shares appear in the SOFP as…',['Equity','Non-current liabilities','Share premium','Current assets'],1,'There is an obligation to pay cash, so they are a liability.'),
 M('What is the critical feature of a financial liability?',['It has a maturity date','A contractual obligation to deliver cash or another financial asset','It pays interest','It is listed'],1,'The contractual obligation is the key test.'),
 M('Quillon buys shares to trade in the short term. They are measured at…',['Amortised cost','FVTOCI','FVTPL','Cost'],2,'Held-for-trading equity is measured at FVTPL.'),
 M('Transaction costs on buying an FVTPL asset are…',['Added to the asset','Expensed to P/L','Taken to OCI','Spread over its life'],1,'For FVTPL assets, transaction costs are expensed.')
],
calc:[
 C('Quillon issues $1,000,000 of loan notes with issue costs of $40,000. The coupon is 5% (paid annually) and the effective rate is 8%. What is the carrying amount at the end of year 1?',986800,'960,000 + 8% × 960,000 (76,800) − 50,000 coupon = $986,800.'),
 C('Quillon issues $2,000,000 of 3-year 5% convertible bonds. The market rate for non-convertible debt is 8%. Discount factors at 8%: 0.926, 0.857, 0.794. What is the EQUITY component?',154300,'Interest 100,000 × (0.926 + 0.857 + 0.794) = 257,700. Principal 2,000,000 × 0.794 = 1,588,000. Liability = 1,845,700. Equity = 2,000,000 − 1,845,700 = $154,300.',{h:'Equity is the residual after valuing the debt.'}),
 C('Quillon buys 10,000 shares at $5.00 each (FVTPL). At the year end they are worth $5.60. What fair value gain goes to P/L?',6000,'10,000 × (5.60 − 5.00) = $6,000.')
],
sort:{p:'From Quillon’s point of view, what is each item?',bins:['Financial asset','Financial liability','Equity instrument'],items:[['Trade receivable',0],['Cash',0],['Investment in another company’s shares',0],['Trade payable',1],['Bank loan',1],['Redeemable preference shares issued',1],['Ordinary shares issued',2],['Irredeemable non-cumulative preference shares issued',2]]},
boss:[
 M('How are compound instruments classified by the issuer?',['All equity','All liability','Split: PV of the liability, with the residual as equity','By management choice'],2,'Value the liability first, and the remainder is equity.'),
 M('How are financial instruments initially measured (not FVTPL)?',['At cost excluding transaction costs','At fair value plus transaction costs','At nominal value','At amortised cost'],1,'Fair value plus transaction costs.'),
 C('A $500,000 loan is issued at par with issue costs of $20,000, a 4% coupon and an effective rate of 6%. What is the finance cost in year 1?',28800,'(500,000 − 20,000) × 6% = $28,800.'),
 M('When should a financial asset be derecognised?',['When it is overdue','When the rights to the cash flows expire or substantially all risks and rewards are transferred','At the year end','When it is impaired'],1,'Those are the IFRS 9 derecognition conditions.'),
 M('Dividends on redeemable preference shares are presented as…',['A distribution in the SOCIE','A finance cost in P/L','OCI','Revenue'],1,'The shares are a liability, so the dividends are a finance cost.')
]},

{ch:12,act:3,title:'Leasing',client:'Brannock Airways',
hook:'Brannock flies 40 aircraft yet shows almost no aircraft on its balance sheet and almost no debt. Bring the leases out of the shadows with IFRS 16.',
cards:[
 ['What is a lease?','A contract that conveys the <b>right to control the use of an identified asset</b> for a period of time in exchange for consideration.'],
 ['Day one for lessees','Dr Right-of-use asset, Cr Lease liability. <b>Liability</b> = PV of the lease payments not yet paid (at the rate implicit in the lease, or the incremental borrowing rate). <b>ROU asset</b> = liability + payments made at or before commencement + initial direct costs + dismantling estimate − incentives.'],
 ['Exemptions','<b>Short-term</b> leases (12 months or less) and <b>low-value</b> assets (such as tablets and small IT equipment) can be expensed on a straight-line basis.'],
 ['After day one','Liability: + interest − payments. ROU asset: depreciate over the <b>shorter of the lease term and useful life</b> (useful life if ownership transfers).'],
 ['Current vs non-current','For payments in arrears, the non-current liability = the balance at the end of NEXT year. Current = this year-end balance − next year-end balance.'],
 ['Sale and leaseback','If the transfer is a sale under IFRS 15: derecognise the asset, recognise an ROU asset for the proportion retained, and take a gain only on the rights transferred. If it is not a sale: keep the asset and treat the proceeds as a financial liability.']
],
mcq:[
 M('Brannock leases an engine for 5 years. What is the double entry at commencement?',['Dr Lease expense, Cr Cash','Dr Right-of-use asset, Cr Lease liability','Dr PPE, Cr Revenue','No entry'],1,'Recognise an ROU asset and a lease liability.'),
 M('Brannock hires a ground vehicle for 9 months. Treatment?',['Capitalise an ROU asset','It can be expensed straight-line (short-term exemption)','Show as a contingent liability','Treat as inventory'],1,'Leases of 12 months or less qualify for the exemption.'),
 M('A lorry has a 6-year life and is leased for 4 years with no ownership transfer. Depreciation period?',['6 years','4 years','5 years','Not depreciated'],1,'The shorter of the lease term and useful life.'),
 M('A sale and leaseback that is NOT a sale under IFRS 15 is accounted for as…',['Revenue','A financial liability for the proceeds','A gain in OCI','An operating lease'],1,'The seller keeps the asset and records a loan.')
],
calc:[
 C('A lease has 5 annual payments of $25,000 in arrears. The rate implicit is 10% and the PV of payments is $94,780. What is the lease liability at the end of year 1?',79258,'94,780 + 9,478 interest − 25,000 = $79,258.',{tol:2}),
 C('Continuing: what is the NON-CURRENT lease liability at the end of year 1? (Year 2 interest = 10% of $79,258.)',62184,'End of year 2: 79,258 + 7,926 − 25,000 = 62,184. That amount is non-current. Current = 17,074.',{tol:2}),
 C('Lease liability $94,780 plus initial direct costs $5,220 = ROU asset. The lease term is 5 years and the useful life 8 years. What is the annual depreciation?',20000,'ROU asset = 100,000 ÷ 5 years (shorter) = $20,000.')
],
sort:{p:'Capitalise (ROU asset and liability), or expense straight-line?',bins:['Capitalise','Expense (exemption)'],items:[['5-year lease of delivery vans',0],['10-year property lease',0],['4-year lease of a factory machine',0],['6-month lease of a crane',1],['Lease of a tablet computer',1],['3-month storage unit',1]]},
boss:[
 C('PV of lease payments $50,000. Initial direct costs $2,000. Lease incentive received $1,000. What is the ROU asset?',51000,'50,000 + 2,000 − 1,000 = $51,000.'),
 C('Lease liability $60,000, rate 8%, annual payment in arrears $15,000. What is the liability after year 1?',49800,'60,000 + 4,800 − 15,000 = $49,800.'),
 M('Space Co leases a tablet computer. Treatment?',['ROU asset and liability','Low-value lease: expense rentals over the lease term','Inventory','Finance lease receivable'],1,'Low-value assets qualify for the exemption.'),
 M('IFRS 16 was introduced mainly to…',['Increase lessor profits','Bring leases (previously operating leases) onto lessees’ balance sheets','Abolish leasing','Change tax rules'],1,'It removes off-balance sheet operating lease finance for lessees.'),
 M('If ownership transfers at the end of the lease, the ROU asset is depreciated over…',['The lease term','The useful life','5 years','It is not depreciated'],1,'The asset will be kept, so use its useful life.')
]},

{ch:13,act:3,title:'Provisions & Events After the Reporting Period',client:'Drummond Oil & Gas',
hook:'Drummond has a “big bath” provision for a restructuring nobody has heard of, and no provision for dismantling its oil rig. Something’s off. Apply IAS 37 and IAS 10.',
cards:[
 ['When to provide','A provision is a <b>liability of uncertain timing or amount</b>. Recognise it when: (1) there is a present obligation (legal or <b>constructive</b>) from a past event, (2) an outflow is probable, and (3) a reliable estimate can be made.'],
 ['How much?','The best estimate. Use <b>expected values</b> for large populations (such as warranties) and the most likely outcome for a single obligation. Discount if the effect is material. <b>Never</b> provide for future operating losses. DO provide for onerous contracts.'],
 ['Restructuring','Provide only if there is a constructive obligation: a <b>detailed formal plan</b> AND a valid expectation raised (implementation started or main features announced). Include only direct costs, NOT retraining, relocation, marketing or new systems.'],
 ['Contingencies','<b>Contingent liability:</b> disclose (unless remote). <b>Contingent asset:</b> disclose only if probable, and recognise only if virtually certain (it is then no longer contingent).'],
 ['Decommissioning','Provide the PV of the costs at the start, adding it to the asset’s cost. Unwind the discount each year as a finance cost.'],
 ['IAS 10','<b>Adjusting</b> events give evidence of conditions AT the reporting date (a customer’s insolvency, inventory sold below cost, a court case settled, fraud discovered). <b>Non-adjusting</b> events reflect conditions arising AFTER it (a fire, share issues, acquisitions, dividends declared) and are disclosed if material.']
],
mcq:[
 M('Drummond expects $2m of operating losses next year. Provision?',['Yes, $2m','No, future operating losses are never provided for','Yes, discounted','Disclose as a contingent asset'],1,'There is no present obligation, so no provision.'),
 M('The board decided before the year end to close a division, but nothing has been announced or started. Provision?',['Yes','No, there is no constructive obligation yet','Yes, at 50%','Only for redundancies'],1,'A plan alone is not enough. A valid expectation must have been created.'),
 M('A rig needs a major overhaul every 5 years. Provide for it over the 5 years?',['Yes','No, there is no present obligation (the rig could be sold)','Only if the auditor agrees','Yes, through OCI'],1,'The future overhaul is not an obligation independent of future actions.'),
 M('A dividend is declared after the year end. Under IAS 10 it is…',['Adjusting, so recognise a liability','Non-adjusting, so disclose','Ignored','Recognised in OCI'],1,'There was no obligation at the reporting date.')
],
calc:[
 C('1,000 units were sold with a warranty. 70% are expected to have no defects, 20% minor defects ($100 each) and 10% major defects ($400 each). What is the warranty provision?',60000,'1,000 × (20% × 100 + 10% × 400) = 1,000 × 60 = $60,000.'),
 C('Decommissioning in 10 years will cost $4m. The PV at 8% is $1,852,000. What is the provision at the end of year 1?',2000160,'1,852,000 × 1.08 = $2,000,160 (unwinding of $148,160 charged to finance costs).'),
 C('Restructuring costs: redundancies $500,000, retraining of remaining staff $80,000, relocation $60,000, new IT systems $120,000, lease termination penalties $40,000. What is the provision?',540000,'Direct costs only: 500,000 + 40,000 = $540,000.')
],
sort:{p:'Adjusting or non-adjusting event?',bins:['Adjusting','Non-adjusting'],items:[['A customer owing money at the year end goes bankrupt',0],['Year-end inventory sold below cost after the year end',0],['A court case settled, confirming a year-end liability',0],['Fraud discovered showing the accounts are wrong',0],['A fire destroys the warehouse after the year end',1],['New shares issued after the year end',1],['Dividend declared after the year end',1],['A major acquisition after the year end',1]]},
boss:[
 M('A provision is a liability of uncertain…',['Value and owner','Timing or amount','Currency','Legality'],1,'Timing or amount.'),
 M('Restaurants owned by the group are converted into franchises. Is this a restructuring?',['Yes, the way the business is conducted changes','No','Only if staff leave','Only if it is announced next year'],0,'A fundamental change in the manner of conducting the business is a restructuring.'),
 M('How are decommissioning costs on an oilfield accounted for?',['Expensed when paid','Provided at PV and capitalised as part of the asset’s cost','Disclosed only','Charged to OCI'],1,'They are capitalised as part of the initial cost of the oilfield.'),
 M('A possible obligation whose outflow is NOT probable (but not remote) is…',['Provided','Disclosed as a contingent liability','Ignored','Recognised as an asset'],1,'Disclose it as a contingent liability.'),
 C('A lawsuit: 60% chance of paying $500,000, 40% chance of paying nothing. Single obligation, most likely outcome. What is the provision?',500000,'For a single obligation, use the most likely outcome: $500,000.')
]},
