{ch:14,act:3,title:'Inventories & Biological Assets',client:'Fallowmere Farms',
hook:'Fallowmere’s barns are full of grain, cattle and unsold tractors, all valued at “what we think it’s worth”. Count it, cost it, and apply IAS 2 and IAS 41.',
cards:[
 ['Lower of cost and NRV','Inventory is measured at the <b>lower of cost and net realisable value</b>, item by item. NRV = estimated selling price − costs to complete − costs to sell.'],
 ['What’s in cost','Purchase price (+ import duties, transport in, − trade discounts) + conversion costs (direct labour, production overheads based on <b>normal capacity</b>). EXCLUDE abnormal waste, storage (unless needed in production), admin overheads and selling costs.'],
 ['Cost formulas','<b>FIFO</b> or <b>weighted average</b>. Use specific identification for unique items. <b>LIFO is prohibited.</b>'],
 ['IAS 41 biological assets','Living animals and plants. Measured at <b>fair value less costs to sell</b> at initial recognition and at each reporting date, with changes going to <b>P/L</b>. Cost is allowed only if fair value cannot be measured reliably at initial recognition.'],
 ['At harvest','Agricultural produce (milk, apples, wool) is measured at FV less costs to sell at the point of harvest, then becomes inventory under IAS 2. <b>Bearer plants</b> (vines, tea bushes) fall under IAS 16. Biological assets are either consumable or bearer.']
],
mcq:[
 M('Which inventory costing method is NOT allowed by IAS 2?',['FIFO','Weighted average','LIFO','Specific identification'],2,'LIFO is prohibited.'),
 M('Which cost is EXCLUDED from inventory cost?',['Transport inwards','Direct labour','Selling costs','Production overheads'],2,'Selling costs are expensed (and deducted when calculating NRV).'),
 M('Fallowmere’s dairy herd is measured at…',['Historical cost','Fair value less costs to sell','Replacement cost','NRV'],1,'IAS 41 uses fair value less costs to sell.'),
 M('Once harvested, apples are accounted for under…',['IAS 41','IAS 16','IAS 2','IFRS 15'],2,'After harvest, the produce becomes inventory under IAS 2.')
],
calc:[
 C('1,000 tractor parts cost $50 each. The selling price is $60, costs to complete $8 and selling costs $5. At what total value are they shown?',47000,'NRV = 60 − 8 − 5 = 47 < cost of 50. Value = 1,000 × 47 = $47,000.'),
 C('Opening: 100 units at $10. Bought 200 at $12, then 100 at $15. Sold 250. What is closing inventory using FIFO?',2100,'The 150 units left are the latest: 100 × 15 + 50 × 12 = $2,100.'),
 C('Same data, using the periodic weighted average. What is closing inventory?',1837.5,'Average = (1,000 + 2,400 + 1,500) ÷ 400 = 12.25. 150 × 12.25 = $1,837.50.'),
 C('Fixed production overheads are $400,000 and normal capacity is 100,000 units. Only 80,000 units were made. What fixed overhead per unit is included in inventory?',4,'Use normal capacity: 400,000 ÷ 100,000 = $4 per unit. The unabsorbed amount is expensed.',{u:'$'})
],
sort:{p:'Include in inventory cost, or exclude?',bins:['Include','Exclude'],items:[['Purchase price',0],['Import duties',0],['Transport inwards',0],['Direct labour',0],['Production overheads (normal capacity)',0],['Abnormal wastage',1],['Selling costs',1],['Administrative overheads',1],['Storage of finished goods',1]]},
boss:[
 M('NRV is the selling price less…',['Cost of sales','Costs to completion and costs necessary to make the sale','Profit margin','Depreciation'],1,'Selling price − costs to complete − costs to sell.'),
 M('IAS 41 has abolished cost as a measurement basis.',['True','False'],1,'False. Cost is allowed if fair value is not available at initial recognition.'),
 M('What are the two categories of biological asset?',['Living and dead','Consumable and bearer','Current and non-current','Plants and animals'],1,'Consumable (for example, livestock for meat) and bearer (for example, dairy cows and orchards).'),
 C('A herd of 100 cattle had FV less costs to sell of $480 each at the start of the year and $530 each at the end. What gain goes to P/L?',5000,'100 × (530 − 480) = $5,000.'),
 C('Item A: cost $200, NRV $260. Item B: cost $300, NRV $240. What is total inventory (item by item)?',440,'A at 200 + B at 240 = $440.')
]},

{ch:15,act:3,title:'Taxation',client:'Harrowgate Engineering',
hook:'Harrowgate’s tax charge jumps around wildly year to year, and the CFO blames “the tax people”. Untangle current tax, prior year errors and deferred tax.',
cards:[
 ['Current tax','The estimated tax on <b>taxable profits</b> for the period: Dr Tax expense, Cr Tax payable. An under-provision from last year INCREASES this year’s charge, and an over-provision decreases it.'],
 ['Deferred tax: the idea','Matches the tax effect of transactions with their accounting impact. <b>Temporary difference = carrying amount − tax base</b>. A taxable temporary difference creates a deferred tax liability, and a deductible one creates a deferred tax asset.'],
 ['Classic examples','Accelerated tax depreciation (CA > tax base) → DT liability. Also interest receivable taxed when received, capitalised development costs deducted for tax when paid, prepayments, and revenue recognised before the cash is received.'],
 ['Revaluations','Revaluing an asset creates a taxable temporary difference. The deferred tax is charged to <b>OCI</b> (against the revaluation surplus), not P/L.'],
 ['P/L tax charge','= Current year estimate + prior year under-provision (or − over-provision) + increase in DT liability (or − decrease). The SOFP shows tax payable (the current year estimate) and the DT liability.']
],
mcq:[
 M('Last year’s tax was underprovided by $5,000. This year’s tax charge is…',['Reduced by $5,000','Increased by $5,000','Unchanged, with prior year restatement','Adjusted in OCI'],1,'An under-provision increases the current charge.'),
 M('Tax allowances are claimed faster than accounting depreciation. This creates a…',['Deferred tax asset','Deferred tax liability','Current tax asset','Nothing'],1,'CA > tax base, so a taxable temporary difference and a DT liability.'),
 M('Deferred tax on a property revaluation gain is charged to…',['P/L','OCI / revaluation surplus','Retained earnings','Share premium'],1,'The tax follows the item, and the gain is in OCI.'),
 M('A temporary difference is…',['Taxable profit − accounting profit','Carrying amount − tax base','Tax paid − tax charged','Deferred tax ÷ rate'],1,'It compares the SOFP carrying amount with the tax base.')
],
calc:[
 C('Current tax estimate $80,000. Prior year under-provision $5,000. The DT liability rises from $30,000 to $42,000. What is the P/L tax charge?',97000,'80,000 + 5,000 + 12,000 = $97,000.'),
 C('Plant has a carrying amount of $400,000 and a tax base of $250,000. The tax rate is 25%. What is the DT liability?',37500,'(400,000 − 250,000) × 25% = $37,500.'),
 C('A property is revalued upwards by $200,000. Tax at 25%. What NET amount is credited to the revaluation surplus?',150000,'200,000 − DT of 50,000 = $150,000.')
],
sort:{p:'Does it create a deferred tax liability or asset?',bins:['DT liability','DT asset'],items:[['Accelerated tax depreciation',0],['Upward revaluation of property',0],['Interest receivable taxed only when received',0],['Development costs capitalised but deducted for tax when paid',0],['Warranty provision deductible only when paid',1],['Unused tax losses carried forward',1],['Accrued expenses deductible only when paid',1]]},
boss:[
 C('Harry Co: prior year over-provision $3,000. Taxable temporary differences increased by $6,000. Tax on profit of $150,000 at 30%. What is the P/L charge?',43800,'45,000 − 3,000 + (6,000 × 30% = 1,800) = $43,800.'),
 M('Deferred tax liabilities are income taxes payable in future periods in respect of…',['Permanent differences','Taxable temporary differences','Dividends','Losses'],1,'Taxable temporary differences.'),
 M('The tax expense related to profit for the year is shown in P/L.',['True','False'],0,'True.'),
 C('Tax payable last year was estimated at $70,000 and settled for $64,000. This year’s estimate is $90,000. What is this year’s P/L current tax charge?',84000,'90,000 − 6,000 over-provision = $84,000.'),
 M('Which item in the SOFP is the current tax liability?',['Total tax charge','Tax on the current year’s profits (the estimate)','Deferred tax','The prior year adjustment'],1,'The SOFP shows the current year estimate payable.')
]},

{ch:16,act:4,title:'Presentation of Published Financial Statements',client:'Penwyn Retail Plc',
hook:'Penwyn’s draft accounts arrived as a jumbled trial balance with dividends sitting in “expenses”. Assemble a proper IAS 1 set before the listing deadline.',
cards:[
 ['A complete set','Statement of financial position, statement of profit or loss and OCI, statement of changes in equity, statement of cash flows, and notes (including accounting policies), all with comparatives.'],
 ['Current vs non-current','<b>Current asset:</b> realised within the normal operating cycle or 12 months, held for trading, or cash/cash equivalent. <b>Current liability:</b> settled in the normal cycle, due within 12 months, or no unconditional right to defer beyond 12 months.'],
 ['P/L formats','By <b>function</b> (cost of sales, distribution, admin), which is the more common, or by <b>nature</b> (materials, staff costs, depreciation). Must be on the face: revenue, finance costs, share of associates, tax expense and profit or loss.'],
 ['OCI','Items such as <b>revaluation gains</b> and gains on FVTOCI investments. Profit + OCI = total comprehensive income.'],
 ['SOCIE','Shows movements in equity: share issues, <b>dividends paid</b>, total comprehensive income, and the transfer of excess depreciation from the revaluation surplus to retained earnings.']
],
mcq:[
 M('Which are CURRENT assets?',['Property and prepayments','Prepayments and cash equivalents','Manufacturing licences and cash','Retained earnings and inventory'],1,'Prepayments and cash equivalents.'),
 M('Where are revaluation gains shown?',['P/L','OCI and the SOCIE','Only the notes','Revenue'],1,'They go through OCI and so appear in the SOCIE.'),
 M('Dividends paid to shareholders are shown in…',['P/L as an expense','The SOCIE','OCI','Finance costs'],1,'Dividends are a distribution of equity, not an expense.'),
 M('Which must appear on the face of the statement of profit or loss?',['An analysis of expenses','Tax expense','Directors’ pay','Segment results'],1,'Tax expense and profit are required on the face. The expense analysis may go in the notes.')
],
calc:[
 C('Revenue $900,000, cost of sales $540,000, distribution $80,000, admin $120,000, finance costs $20,000, tax $35,000. What is profit for the year?',105000,'900 − 540 − 80 − 120 − 20 − 35 = $105,000 (in thousands).'),
 C('Opening RE $400,000. Profit $105,000. Dividends paid $30,000. Transfer of excess depreciation from the revaluation surplus $10,000. What is closing RE?',485000,'400 + 105 − 30 + 10 = $485,000 (in thousands).'),
 C('A $500,000 loan has $100,000 repayable within the next 12 months. What amount is NON-current?',400000,'500,000 − 100,000 = $400,000.'),
 C('Profit for the year is $105,000 and there is a property revaluation gain of $60,000. What is total comprehensive income?',165000,'105,000 + 60,000 = $165,000.')
],
sort:{p:'Where does each item go?',bins:['Profit or loss','OCI','SOCIE only'],items:[['Depreciation',0],['Finance costs',0],['Tax expense',0],['Revaluation gain on property',1],['Gain on an FVTOCI equity investment',1],['Dividends paid',2],['Issue of new shares',2],['Transfer of excess depreciation to RE',2]]},
boss:[
 M('Provisions must be disclosed in the SOFP.',['True','False'],0,'True.'),
 M('Classification of expenses by FUNCTION includes…',['Staff costs','Raw materials used','Cost of sales','Depreciation'],2,'Cost of sales, distribution and admin are functions.'),
 C('Gross profit is $400,000. Distribution $60,000, admin $90,000, finance costs $15,000, tax $50,000. What is profit for the year?',185000,'400 − 60 − 90 − 15 − 50 = $185,000 (in thousands).'),
 M('The statement formerly called the “statement of comprehensive income” is now the…',['Income statement','Statement of profit or loss and other comprehensive income','Statement of performance','Statement of earnings'],1,'This was renamed by the 2011 amendment to IAS 1.'),
 M('A bank loan repayable 8 months after the year end is…',['Non-current','Current','Equity','Contingent'],1,'It is due within 12 months, so current.')
]},
// ---------------- CH 17 ----------------
{ch:17,act:4,title:'Reporting Financial Performance',client:'Corrigan Industries',
hook:'Corrigan quietly changed its depreciation lives, hid a closed division in continuing results, and “forgot” a currency loss. Uncover the restatements.',
cards:[
 ['IAS 8: policies','Change a policy only if an IFRS requires it or it gives more reliable and relevant information. Apply it <b>retrospectively</b>: restate comparatives and adjust opening retained earnings.'],
 ['IAS 8: estimates','Useful lives, residual values, receivables allowances, and the depreciation method too. Changes are <b>prospective</b>: they affect the current and future periods only.'],
 ['IAS 8: errors','Material prior period errors are corrected <b>retrospectively</b> by restating the comparatives and the opening balance of retained earnings.'],
 ['IFRS 5: held for sale','Conditions: available for immediate sale in its present condition, and sale <b>highly probable</b> (committed plan, active marketing at a reasonable price, expected within 12 months). Measure at the <b>lower of carrying amount and FV less costs to sell</b>. Stop depreciating and present separately.'],
 ['Discontinued operations','A component disposed of or held for sale that is a separate major line of business or geographical area (or a subsidiary bought only to resell). Show a <b>single amount</b> on the face of P/L.'],
 ['IAS 21: foreign currency','Record transactions at the <b>spot rate</b>. At the year end, retranslate <b>monetary</b> items (receivables, payables, loans) at the closing rate, with differences to P/L. <b>Non-monetary</b> items (PPE, inventory at cost) stay at the historical rate. Functional currency = the currency of the primary economic environment.']
],
mcq:[
 M('Corrigan revises a machine’s useful life from 10 to 6 years. This is…',['A change in policy, retrospective','A change in estimate, prospective','An error','Ignored'],1,'Useful life is an estimate, so the change is prospective.'),
 M('Corrigan switches inventory valuation from weighted average to FIFO. This is…',['A change in estimate','A change in accounting policy, retrospective','Not allowed','A prior period error'],1,'A change in cost formula is a policy change.'),

{id:'c3',title:'Penwyn’s financial statements',chs:[16,3,11,15],kind:'prep',gen:()=>{

{id:'c4',title:'Thornbury: two-year interpretation',chs:[19,20],kind:'interp',gen:()=>{
  const ex=EXTRA[19].makeEx(),a=ex.v,K1=v=>Math.round(v/1000);
  const ev=P(['reval','loan','price','none']),g=R(-8,22)/100;
  const b={rev:a.rev*(1+g)};const gpA=1-a.cos/a.rev,gpB=Math.max(.12,gpA+(ev==='price'?-R(2,5):R(-3,3))/100);b.cos=b.rev*(1-gpB);
  b.pbit=b.rev*Math.max(.03,a.pbit/a.rev+R(-4,3)/100);b.ln=a.ln+(ev==='loan'?K(R(300,900,50)):K(R(-80,80,10)));b.int=Math.max(1000,b.ln*a.int/Math.max(a.ln,1)*(R(90,115)/100));
  b.eq=a.eq+K(R(20,200,10))+(ev==='reval'?K(R(300,800,50)):0);b.inv=b.cos*(a.inv/a.cos)*(R(80,135)/100);b.rec=b.rev*(a.rec/a.rev)*(R(80,135)/100);b.cash=Math.max(5000,a.cash*(R(40,160)/100)+(ev==='loan'?K(R(50,200,10)):0));b.cl=a.cl*(R(85,130)/100);
  const yrs=[a,b].map(v=>Object.fromEntries(Object.entries(v).map(([k,x])=>[k,K1(x)])));
  const R_={gp:v=>(v.rev-v.cos)/v.rev*100,om:v=>v.pbit/v.rev*100,roce:v=>v.pbit/(v.eq+v.ln)*100,at:v=>v.rev/(v.eq+v.ln),cr:v=>(v.inv+v.rec+v.cash)/v.cl,qr:v=>(v.rec+v.cash)/v.cl,id:v=>v.inv/v.cos*365,rd_:v=>v.rec/v.rev*365,ge:v=>v.ln/(v.ln+v.eq)*100,ic:v=>v.pbit/Math.max(v.int,1)};
  const L={gp:['Gross profit margin','%',.15],om:['Operating margin','%',.15],roce:['ROCE','%',.15],at:['Asset turnover','times',.02],cr:['Current ratio',':1',.02],qr:['Quick ratio',':1',.02],id:['Inventory holding period','days',.5],rd_:['Receivables collection period','days',.5],ge:['Gearing','%',.15],ic:['Interest cover','times',.06]};
  const keys=shuffle(Object.keys(L)).slice(0,8);const dp=k=>['at','cr','qr'].includes(k)?2:1;
  const val=(k,y)=>rd(R_[k](yrs[y]),dp(k));
  const ratios=keys.map(k=>({label:L[k][0],u:L[k][1],a:val(k,1),prior:val(k,0),marks:1,tol:L[k][2],e:`Prior year ${val(k,0)}${L[k][1]==='%'?'%':' '+L[k][1]}.`}));
  const pts=[];const up=k=>val(k,1)>val(k,0),fmt2=(k,y)=>val(k,y)+(L[k][1]==='%'?'%':L[k][1]===':1'?':1':' '+L[k][1]);
  const add=(ok,t,why)=>pts.push({ok,t,why});
  const mv=(k,name,reasonUp,reasonDown)=>{const u=up(k);add(true,`${name} ${u?'rose':'fell'} from ${fmt2(k,0)} to ${fmt2(k,1)}, ${u?reasonUp:reasonDown}.`,'Consistent with the figures.');add(false,`${name} ${u?'rose':'fell'} from ${fmt2(k,0)} to ${fmt2(k,1)}, ${u?reasonDown:reasonUp}.`,`The movement is right but the conclusion is the opposite of what a ${u?'rise':'fall'} means.`)};
  mv('gp','Gross margin','possibly from better purchasing or a richer sales mix','possibly from price cutting or higher purchase costs');
  mv('roce','ROCE','showing more profit generated from the capital employed','showing less profit generated from the capital employed');
  mv('cr','The current ratio','suggesting a stronger short-term liquidity position','suggesting weaker short-term liquidity');
  mv('id','Inventory days','which may indicate slow-moving or obsolete stock','suggesting tighter inventory control');
  mv('rd_','Receivables days','suggesting weaker credit control, which ties up cash','suggesting faster collection from customers');
  mv('ge','Gearing','increasing the financial risk for shareholders','reducing the financial risk for shareholders');
  const evp={reval:[[true,'The property revaluation increased capital employed, which depresses ROCE without any real change in performance.'],[false,'The property revaluation increased profit for the year, which explains the movement in ROCE.']],
    loan:[[true,'The new loan increased gearing and finance costs, which puts pressure on interest cover.'],[false,'The new loan reduced gearing, because the extra cash raised increases equity.']],
    price:[[true,'The price-cutting campaign helps explain the fall in gross margin, though it may have supported revenue.'],[false,'The price-cutting campaign should have increased gross margin, as more units were sold.']],
    none:[[true,'Ratios alone don’t explain causes. Industry averages and prior-year context are needed for a full analysis.'],[false,'A rise in revenue always means profitability has improved.']]};
  evp[ev].forEach(([ok,t])=>add(ok,t,ok?'Valid analysis.':'Incorrect reasoning.'));
  const evTxt={reval:'During the current year Thornbury revalued its properties upwards.',loan:'During the current year Thornbury raised a new long-term bank loan to fund expansion.',price:'During the current year Thornbury ran an aggressive price-cutting campaign to win market share.',none:'Thornbury’s directors say the current year was “business as usual”.'}[ev];
  const rows=[['Revenue','rev'],['Cost of sales','cos'],['Profit before interest and tax','pbit'],['Interest expense','int'],['Equity','eq'],['Loan notes (non-current)','ln'],['Inventory','inv'],['Trade receivables','rec'],['Cash','cash'],['Current liabilities','cl']];
  return{scen:`<p>${evTxt} Extracts from Thornbury Co’s financial statements ($000):</p>${tbl3(['','Current year','Prior year'],rows.map(([l,k])=>[l,yrs[1][k],yrs[0][k]]))}<p>Use year-end figures. Capital employed = equity + loan notes. Gearing = debt ÷ (debt + equity).</p>`,
   ratios,points:shuffle(pts)};
}}
];

<script>
const __SRC=(()=>{try{const b=document.body.cloneNode(true);const a=b.querySelector('#app');if(a)a.innerHTML='';const md=b.querySelector('#modal');if(md){md.innerHTML='';md.hidden=true}b.querySelectorAll('.toast,.fx,.flash').forEach(x=>x.remove());return b.innerHTML}catch(err){return''}})();
// ===== Ledger & Lens engine v2 =====
const SKEY='ledger-lens-save-v1';
const RANKS=[[0,'Trainee Investigator'],[2,'Junior Forensic Associate'],[5,'Associate Investigator'],[8,'Senior Associate'],[11,'Assistant Manager'],[14,'Case Manager'],[17,'Senior Manager'],[20,'Director of Investigations'],[23,'Partner']];
const STAGES={brief:'Briefing',mcq:'Interrogation',calc:'Number crunch',sort:'Evidence board',boss:'Confrontation'};
const BADGES=[['first','First case closed'],['perfect','Flawless case'],['streak','10-answer combo'],['speed','Quick draw'],['groups','Group detective'],['untouched','Untouchable (no hearts lost)'],['cold','Cold case closer'],['daily3','3-day daily streak'],['partner','Made partner'],['final','Managing partner']];
const LINES={
 smug:['Ha! Call yourself an accountant?','Those numbers look fine to me.','My auditors never asked about that.','Wrong. Shall we wrap this up?','I think we’re done here, detective.','Is that what they teach trainees now?','Try reading the standard sometime.'],

 panic:['Okay, okay! It was the FD’s idea!','I need to call my lawyer.','You can’t prove intent!','Please, my bonus depends on this!','*sweats profusely*','Stop! Fine! Just stop!'],

};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{const a=Math.abs(n);const s=Number.isInteger(a)?a.toLocaleString('en-US'):a.toLocaleString('en-US',{maximumFractionDigits:2});return (n<0?'−':'')+s};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();

// ---------- merge content ----------
LEVELS.forEach(l=>{const x=EXTRA[l.ch];

});

// ---------- save ----------

const cleared=()=>LEVELS.filter(l=>S.stars[l.ch]).length;
function rankIdx(n){let r=0;RANKS.forEach((x,i)=>{if(n>=x[0])r=i});return r}

const unlocked=i=>i===0||!!S.stars[LEVELS[i-1].ch];

const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

// ---------- smart selection ----------
function weight(id){const st=S.qs[id];if(!st)return 3;const[r,w]=st;if(r>=3&&w===0)return .3;return Math.max(.3,(1+2.5*w)/(1+r))}
function wpick(arr,k){const pool=arr.slice(),out=[];while(out.length<k&&pool.length){const tot=pool.reduce((a,x)=>a+weight(x.id),0);let r=Math.random()*tot,j=0;for(;j<pool.length-1;j++){r-=weight(pool[j].id);if(r<=0)break}out.push(pool.splice(j,1)[0])}return out}
function record(id,ok){const st=S.qs[id]||[0,0];if(ok)st[0]++;else st[1]++;S.qs[id]=st}
function inst(l,item,ex){
  if(item.k==='m'){const q=l.pool[item.i];const tf=q.o.length===2&&q.o[0]==='True';const ord=tf?[0,1]:shuffle(q.o.map((_,j)=>j));
    return{t:'m',q:q.q,o:ord.map(j=>q.o[j]),a:ord.indexOf(q.a),e:q.e,id:item.id,l}}
  const e=ex||(l.makeEx?l.makeEx():null);const q=l.gens[item.i](e);return Object.assign({},q,{id:item.id,l,ex:q.useEx?e:null});
}
function resolveId(id){const m=id.match(/^(\d+)([mg])(\d+)$/);if(!m)return null;const l=LEVELS.find(x=>x.ch===+m[1]);if(!l)return null;const it=l.items.find(x=>x.id===id);return it?{l,it}:null}

// ---------- sound ----------
const SFX={ctx:null,
 init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},
 tone(f,d,type='sine',v=.12,t0=0,f2){const c=this.ctx;if(!c)return;const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)},
 noise(d,v=.2,t0=0,lp=800){const c=this.ctx;if(!c)return;const t=c.currentTime+t0,b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)},
 play(n){if(S.muted)return;this.init();if(!this.ctx)return;switch(n){
  case'click':this.noise(.03,.12,0,4000);this.tone(1800,.02,'square',.02);break;
  case'good':this.tone(660,.12,'sine',.14);this.tone(990,.22,'sine',.14,.09);break;
  case'bad':this.tone(180,.32,'sawtooth',.07,0,80);break;
  case'stamp':this.noise(.25,.5,0,300);this.tone(70,.3,'sine',.35,0,40);break;
  case'tick':this.tone(1300,.03,'square',.03);break;
  case'combo':[523,659,784,1047].forEach((f,i)=>this.tone(f,.12,'triangle',.1,i*.06));break;
  case'hit':this.noise(.12,.3,0,1500);this.tone(240,.15,'square',.07,0,120);break;
  case'heart':this.tone(440,.15,'triangle',.1,0,330);this.tone(330,.25,'triangle',.1,.12,180);break;
  case'fanfare':[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,i===5?.5:.14,'triangle',.12,i*.12));break;
  case'flip':this.noise(.08,.15,0,2500);break;
  case'escape':[400,300,200].forEach((f,i)=>this.tone(f,.18,'sawtooth',.05,i*.12));break;
 }}};

// ---------- CASE ----------
function intro(i){
  const l=LEVELS[i],ex=l.makeEx?l.makeEx():null;
  const mI=l.items.filter(x=>x.k==='m'),gI=l.items.filter(x=>x.k==='g');
  const mSel=wpick(mI,4),rest=mI.filter(x=>!mSel.includes(x));
  const cSel=wpick(gI,Math.min(3,gI.length));
  const gRest=gI.filter(x=>!cSel.includes(x));
  const bG=gI.length?wpick(gRest.length?gRest:gI,Math.min(2,gI.length)):[];
  const bM=wpick(rest,5-bG.length);
  const bins=l.sort.bins.length,want=Math.min(l.sortItems.length,bins>=3?8:7);
  const its=shuffle(l.sortItems.map((x,k)=>({t:x[0],b:x[1],k})));const sortSel=[];
  for(let b=0;b<bins;b++){const f=its.find(x=>x.b===b&&!sortSel.includes(x));if(f)sortSel.push(f)}
  its.forEach(x=>{if(sortSel.length<want&&!sortSel.includes(x))sortSel.push(x)});
  lobbyPresence({phase:'case',hosting:null});
  run={mode:'case',i,l,ex,qs:{mcq:mSel.map(x=>inst(l,x,ex)),calc:cSel.map(x=>inst(l,x,ex)),boss:shuffle([...bM,...bG]).map(x=>inst(l,x,ex))},sortSel:shuffle(sortSel),
    stages:['brief','mcq',...(cSel.length?['calc']:[]),'sort','boss'],si:0,qi:0,score:0,poss:0,clues:3,streak:0,maxStreak:0,xp:0,pressure:0,hearts:3,hp:100};
  const bc=SECB.filter(c=>c.chs.includes(l.ch));if(bc.length){run.bossCase=instB(P(bc));run.qs.boss=run.bossCase.qs}
  run.bossTotal=run.qs.boss.length*(run.bossCase?45:30);run.bossLeft=run.bossTotal;
  app.innerHTML=`${caseHead()}
   <div class="sheet stack flipin">${suspectPanel(l,'smug')}<div class="eyebrow">Client: ${esc(l.client)}</div><p class="hook">${esc(l.hook)}</p>
   <div class="row" style="font:600 13px var(--f-mono)">${run.stages.map((s,k)=>`<span class="chip">${k+1}. ${STAGES[s]}</span>`).join('')}</div>
   <p class="muted" style="margin:0;font-size:14px">The questions and numbers change every time you play. You have 3 clues; a clue halves that answer’s points. Correct answers in a row build a combo for bonus XP. In the confrontation you have 3 hearts and ${run.bossTotal} seconds; the clock pauses while you read the feedback.</p>
   <div class="row"><button class="btn red" id="go" type="button">Open the case file</button><button class="btn ghost" id="skipb" type="button">Skip briefing</button></div></div>`;
  bindHead();say(pickLine('boss'));
  $('#go').onclick=()=>go(stage);$('#skipb').onclick=()=>{run.si=1;go(stage)};

function caseHead(){const l=run.l;

function exhibitHTML(ex,l){if(!ex)return'';return `<div class="exhibit"><div class="eyebrow" style="margin-bottom:4px">Exhibit A · ${esc(l.client)} ($)</div><table>${ex.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></div>`}
function onCorrect(el,base,clue){

function scoreQ(q,ok,clue,pts){run.poss+=pts;record(q.id,ok);

function quiz(kind){

function askQ(box,q,o){

  if(q.t==='m')h+=`<div class="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}" type="button"><span class="k">${'ABCD'[k]}</span><span>${esc(t)}</span></button>`).join('')}</div>`;
  else{const pre=q.u==='$'?'$':'',post=q.u&&q.u!=='$'?q.u:'';
    h+=`<form class="calcrow" id="cf"><span class="unit">${pre}</span><input class="numin" id="ans" inputmode="decimal" autocomplete="off" aria-label="Your answer" placeholder="0"><span class="unit">${esc(post)}</span><button class="btn red" type="submit">Submit</button></form>`}

      inp.disabled=true;box.querySelector('#cf button').disabled=true;const ok=Math.abs(v-q.a)<=q.tol;

    if(q.t==='m')shuffle(q.o.map((_,k)=>k).filter(k=>k!==q.a)).slice(0,2).forEach(k=>{const b=box.querySelector(`.opt[data-k="${k}"]`);b.classList.add('gone');b.disabled=true});

function parseNum(s){if(!s)return null;let t=String(s).trim(),neg=false;if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1)}

function results(){

  if(pass){award('first');if(acc>=.999)award('perfect');if(!run.escaped&&run.bossLeft>=run.bossTotal*.4)award('speed');if(run.hearts===3)award('untouched');if([7,8,9,10].every(c=>S.stars[c]))award('groups');if(cleared()>=23)award('partner')}

      <button class="btn ghost" id="retry" type="button">Replay case</button><button class="btn ghost" id="home" type="button">Back to the case board</button>
    </div></section>`;
  say(pass?l.confess:'You’ve got nothing on me. See you never, detective.');

  setTimeout(()=>{const st=$('#stamp');if(!st)return;st.style.visibility='visible';anim(st,'stamp');setTimeout(()=>{SFX.play('stamp');anim(app,'quake');const[x,y]=fxAt(st);burst(x,y,26,pass?null:['var(--muted)']);if(pass&&stars===3)confetti()},250)},RM?0:500);
  let c=0;const xi=setInterval(()=>{c=Math.min(gain,c+Math.ceil(gain/25)+1);const e=$('#xpc');if(e)e.textContent='+'+c;if(c>=gain)clearInterval(xi)},40);

  $('#retry').onclick=()=>go(()=>intro(i));$('#home').onclick=()=>go(office);

  askQ($('#qbox'),q,{label:`Question ${run.qi+1} of ${run.pool.length}`,pre:timer+exhibitHTML(q.ex,it.l),clues:false,combo:true,
    onAnswer:(ok,_c,el)=>{paused=true;record(q.id,ok);
      if(ok){run.right++;run.streak++;run.maxStreak=Math.max(run.maxStreak,run.streak);const amt=Math.round(10*mult());run.xp+=amt;S.xp+=amt;const[x,y]=fxAt(el);burst(x,y);floatText(x-30,y-10,`+${amt} XP`);SFX.play('good');if(run.streak>=10)award('streak');c.onRight&&c.onRight(q)}
      else{run.streak=0;anim(el,'shake');SFX.play('bad');c.onWrong&&c.onWrong(q)}

async function joinMatch(code,host){
  if(!MP.room)return;leaveMatch();VIEW='match';
  app.innerHTML=`<div class="sheet" style="margin-top:28px"><h2>Joining match ${esc(code)}…</h2></div>`;
  let r;try{r=await MP.room.join(code)}catch(e){app.innerHTML=`<div class="sheet stack" style="margin-top:28px"><h2>Couldn’t join</h2><p>${e&&e.code==='limit_reached'?'Too many rooms are open. Try again in a moment.':'The match room isn’t available right now.'}</p><div><button class="btn" id="b" type="button">Back</button></div></div>`;$('#b').onclick=()=>go(showdown);return}
  const m=MP.match={code,r,host:!!host,cfg:host?{scope:host.scope,n:host.n}:null,started:false,over:false,qs:null,qi:0,score:0,correct:0,cache:{},unsubs:[],written:false};
  run={mode:'match',clues:0,streak:0,maxStreak:0,xp:0,pressure:0};
  if(m.host)lobbyPresence({phase:'hosting',hosting:code,scope:scopeLabel(host.scope),n:host.n});else lobbyPresence({phase:'racing',hosting:null});
  r.presence({uid:MP.uid,nick:(S.name||'Investigator').slice(0,28),host:m.host,score:0,qi:0,correct:0,done:false,scope:m.cfg?scopeLabel(m.cfg.scope):null,n:m.cfg?m.cfg.n:null}).catch(()=>{});
  m.unsubs.push(r.onPeers(ch=>{if(MP.match!==m)return;ch.peers.forEach(p=>{if(p.kind==='viewer'&&p.presence&&p.presence.nick)m.cache[p.peer]=Object.assign({},p.presence,{isMe:p.isMe,by:p.by,here:true})});ch.left.forEach(p=>{if(m.cache[p.peer])m.cache[p.peer].here=false});
    if(m.host&&m.started&&!m.over&&ch.joined.some(p=>!p.isMe))r.emit('start',Object.assign({},m.cfg,{elapsed:Date.now()-m.t0})).catch(()=>{});
    paintBoard();if(!m.started)paintLobby();checkEnd()},e=>{if(MP.match===m){app.insertAdjacentHTML('afterbegin','<p class="unlock-note">Lost the connection to the match.</p>')}}));
  m.unsubs.push(r.on('start',msg=>{if(MP.match!==m||m.started)return;const d=msg.data||{};if(typeof d.seed!=='number'||!SCOPE_RE.test(d.scope)||![5,8,12].includes(d.n))return;
    m.cfg={seed:d.seed,scope:d.scope,n:d.n,limit:d.n*25000};m.t0=Date.now()+(d.startIn||0)-(d.elapsed||0);startRace()}));
  CHAT.match=[];m.unsubs.push(r.on('chat',msg=>{if(MP.match===m)onChat('match',msg)}));
  m.unsubs.push(r.on('react',msg=>{if(MP.match!==m)return;const t=TAUNTS[(msg.data||{}).i];if(!t)return;const who=(m.cache[msg.peer]||{}).nick||'Someone';toast(`${who}: ${t}`);SFX.play('flip')}));
  m.unsubs.push(r.on('ended',msg=>{if(MP.match!==m||!m.started)return;if(!m.over&&Date.now()>m.t0+m.cfg.limit-2000)finishMatch()}));
  paintLobby();
}
function tauntBar(){return `<div class="taunts">${TAUNTS.map((t,i)=>`<button class="chip tbtn" data-t="${i}" type="button">${esc(t)}</button>`).join('')}</div>`}
function bindTaunts(){app.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{const m=MP.match;if(!m)return;m.r.emit('react',{i:+b.dataset.t}).catch(e=>{if(e&&e.code==='not_permitted')toast('Your access level can’t send reactions')});anim(b,'pop')})}
function paintLobby(){const m=MP.match;if(!m||m.started)return;
  const ps=Object.values(m.cache).filter(p=>p.here);const hostP=ps.find(p=>p.host);
  if(!$('#mLobby')){
    app.innerHTML=`<div class="casehead"><div><div class="eyebrow">Showdown lobby</div><h1 style="font-size:clamp(32px,6vw,48px)">Match <span class="code">${esc(m.code)}</span></h1></div><button class="btn ghost" id="leave" type="button">Leave</button></div>
    <div class="sheet stack slidein" id="mLobby" style="margin-top:18px"><p id="lobInfo" style="margin:0"></p><div id="lobPlayers" class="lob-players"></div>
     <div class="row" id="lobCtl"></div>
     <div class="invite"><span class="eyebrow">Invite friends</span><p style="margin:4px 0 8px;font-size:14px" id="invTxt"></p><div class="row"><button class="btn sm" id="invBtn" type="button">Copy invite</button>${navigator.share&&MP.p2p?'<button class="btn ghost sm" id="shrBtn" type="button">Share…</button>':''}</div></div>${tauntBar()}</div>
    <div class="sheet stack" style="margin-top:16px"><h3>Match chat</h3>${chatHTML('match')}</div>`;
    $('#leave').onclick=()=>go(showdown);bindTaunts();bindChat('match');
    const inv=`Join my Ledger & Lens showdown! Open the game, go to Showdown and enter match code ${m.code}.`;$('#invTxt').textContent=inv;
    $('#invBtn').onclick=()=>{try{navigator.clipboard.writeText(inv).then(()=>toast('Invite copied'),()=>{selectText($('#invTxt'));toast('Select and copy the text above')})}catch(e){selectText($('#invTxt'))}};
    const sb2=$('#shrBtn');if(sb2)sb2.onclick=()=>navigator.share({title:'Ledger & Lens showdown',text:inv}).catch(()=>{});
  }
  const scope=m.cfg?scopeLabel(m.cfg.scope):(hostP&&hostP.scope)||'…';const n=m.cfg?m.cfg.n:(hostP&&hostP.n)||'…';
  $('#lobInfo').innerHTML=`Topics: <b>${esc(scope)}</b> · ${esc(String(n))} questions · ${esc(String(typeof n==='number'?n*25:'?'))}s time limit. Friends can join with the code <b>${esc(m.code)}</b> from the Showdown page.`;
  $('#lobPlayers').innerHTML=ps.map((p,i)=>`<div class="lob-p rise" style="--d:${i*60}ms"><span class="dot"></span><b>${esc(p.nick)}</b>${p.isMe?' (you)':''}${p.host?' <span class="chip">host</span>':''}</div>`).join('')||'<span class="muted">Waiting for players…</span>';
  $('#lobCtl').innerHTML=m.host?`<button class="btn red" id="startM" type="button">Start match (${ps.length} player${ps.length===1?'':'s'})</button>`:`<span class="muted">${hostP?'Waiting for the host to start…':'Waiting for the host…'}</span>`;
  const sb=$('#startM');if(sb)sb.onclick=async()=>{sb.disabled=true;const seed=Math.floor(Math.random()*2**31);
    try{await m.r.emit('start',{seed,scope:m.cfg.scope,n:m.cfg.n,startIn:3500});setTimeout(()=>{if(MP.match===m&&!m.started){sb.disabled=false;toast('Couldn’t reach the room. Try again.')}},2500)}
    catch(e){sb.disabled=false;toast(e&&e.code==='not_permitted'?'Your access level can’t host. Ask the owner for Contributor access.':'Couldn’t start. Try again.')}};
}
function startRace(){const m=MP.match;m.started=true;
  m.qs=withSeed(m.cfg.seed,()=>{const all=[];scopeLevels(m.cfg.scope).forEach(l=>l.items.forEach(it=>all.push({l,it})));return shuffle(all).slice(0,m.cfg.n).map(p=>inst(p.l,p.it,null))});
  m.qi=Math.max(0,Math.min(m.qi,m.qs.length));
  if(m.host)lobbyPresence({phase:'racing',hosting:null});
  const wait=m.t0-Date.now();
  if(wait>0){let n=Math.ceil(wait/1000);app.innerHTML=`<div class="countdown" id="cd">${n}</div>`;SFX.play('tick');
    const t=setInterval(()=>{n--;const c=$('#cd');if(n<=0){clearInterval(t);SFX.play('combo');raceQ()}else if(c){c.textContent=n;anim(c,'pop');SFX.play('tick')}},1000)}
  else raceQ();
}
function raceShell(){return `<div class="race"><div><div class="row" style="justify-content:space-between"><span class="eyebrow">Showdown ${esc(MP.match.code)} · ${esc(scopeLabel(MP.match.cfg.scope))}</span><span id="tcount" style="font:600 14px var(--f-mono)"></span></div><div class="timer" id="tmr"><i></i></div><div class="sheet slidein" id="qbox"></div>${tauntBar()}</div>
  <aside class="sheet live"><div class="eyebrow">Live scoreboard</div><ol class="lb" id="liveBoard"></ol><div class="eyebrow" style="margin-top:14px">Match chat</div>${chatHTML('match')}</aside></div>`}
function raceTimer(){const m=MP.match;stopTimer();const tick=()=>{if(MP.match!==m)return stopTimer();const left=Math.max(0,m.t0+m.cfg.limit-Date.now()),p=left/m.cfg.limit;const t=$('#tmr');if(t){t.querySelector('i').style.width=p*100+'%';t.classList.toggle('low',p<.2)}const c=$('#tcount');if(c){const s=Math.ceil(left/1000);c.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}if(left<=0){stopTimer();finishMatch()}};tick();timerId=setInterval(tick,250)}
function raceQ(){const m=MP.match;if(!m||m.over)return;if(m.qi>=m.qs.length)return waitScreen();
  const q=m.qs[m.qi],t0=Date.now();app.innerHTML=raceShell();bindTaunts();bindChat('match');paintBoard();raceTimer();
  askQ($('#qbox'),q,{label:`Question ${m.qi+1} of ${m.qs.length}`,pre:exhibitHTML(q.ex,q.l),clues:false,combo:true,
    onAnswer:(ok,_c,el)=>{record(q.id,ok);let pts=0;
      if(ok){const secs=(Date.now()-t0)/1000;pts=100+Math.max(0,50-Math.floor(secs)*3);m.score+=pts;m.correct++;run.streak++;const[x,y]=fxAt(el);burst(x,y);floatText(x-30,y-10,`+${pts}`);SFX.play('good')}
      else{run.streak=0;anim(el,'shake');SFX.play('bad')}
      refreshCombo();m.qi++;m.r.presence({score:m.score,qi:m.qi,correct:m.correct,done:m.qi>=m.qs.length}).catch(()=>{});paintBoard()},
    onNext:()=>{if(MP.match!==m)return;if(m.qi>=m.qs.length)waitScreen();else{stopTimer();raceQ()}}});
}
function waitScreen(){const m=MP.match;if(!m||m.over)return;
  app.innerHTML=raceShell();bindTaunts();bindChat('match');$('#qbox').innerHTML=`<h2>All answered</h2><p>You scored <b>${m.score}</b> with ${m.correct}/${m.qs.length} correct. Waiting for the others to finish…</p>`;paintBoard();raceTimer();checkEnd()}
function standings(){const m=MP.match;return Object.values(m.cache).sort((a,b)=>(b.score||0)-(a.score||0)||(b.correct||0)-(a.correct||0))}
function paintBoard(){const m=MP.match,el=$('#liveBoard');if(!m||!el)return;const n=m.cfg&&m.cfg.n||1;
  el.innerHTML=standings().map((p,i)=>`<li class="lb-row ${p.isMe?'me':''} ${p.here?'':'gone'}"><span class="lb-pos">${i+1}</span><span class="lb-name"><b>${esc(p.nick)}${p.isMe?' (you)':''}</b><span class="prog"><i style="width:${Math.min(100,(p.qi||0)/n*100)}%"></i></span><small>${p.done?'finished':`question ${Math.min(n,(p.qi||0)+1)} of ${n}`}${p.here?'':' · left'}</small></span><span class="lb-val">${fmt(p.score||0)}</span></li>`).join('')}
function checkEnd(){const m=MP.match;if(!m||!m.started||m.over)return;const ps=Object.values(m.cache).filter(p=>p.here);if(ps.length&&ps.every(p=>p.done))setTimeout(()=>{if(MP.match===m&&!m.over)finishMatch()},800)}
function finishMatch(){const m=MP.match;if(!m||m.over)return;m.over=true;stopTimer();
  if(m.qi<(m.qs||[]).length)m.r.presence({done:true}).catch(()=>{});
  const st=standings(),myI=st.findIndex(p=>p.isMe),top=st[0]||{},won=myI===0&&(top.score||0)>0&&st.length>1;
  if(!m.written){m.written=true;S.mp=S.mp||{wins:0,played:0,best:0};S.mp.played++;if(won)S.mp.wins++;S.mp.best=Math.max(S.mp.best,m.score);const gain=m.correct*15+(won?100:0);S.xp+=gain;m.gain=gain;save()}
  const pod=[st[1],st[0],st[2]];
  app.innerHTML=`<section class="sheet stack" style="margin-top:28px;text-align:center;align-items:center"><div class="eyebrow">Showdown ${esc(m.code)} · ${esc(scopeLabel(m.cfg.scope))}</div>
   <div class="stamp ${myI===0?'':'fail'}">${st.length<2?'PRACTICE DONE':myI===0?'WINNER':'#'+(myI+1)+' PLACE'}</div>
   <div class="podium">${pod.map((p,k)=>p?`<div class="pod p${[2,1,3][k]}"><b>${esc(p.nick)}${p.isMe?' (you)':''}</b><span>${fmt(p.score||0)}</span><div class="blk">${[2,1,3][k]}</div></div>`:'<div class="pod empty"></div>').join('')}</div>
   <ol class="lb" style="width:100%;max-width:520px;text-align:left">${st.map((p,i)=>`<li class="lb-row ${p.isMe?'me':''}"><span class="lb-pos">${i+1}</span><span class="lb-name"><b>${esc(p.nick)}${p.isMe?' (you)':''}</b><small>${p.correct||0} correct</small></span><span class="lb-val">${fmt(p.score||0)}</span></li>`).join('')}</ol>
   <p class="muted">+${m.gain||0} XP${won?' including a 100 XP win bonus':''}.</p>
   <div style="width:100%;max-width:520px;text-align:left"><div class="eyebrow">Match chat</div>${chatHTML('match')}</div>
   <div class="row" style="justify-content:center">${m.host?'<button class="btn red" id="again" type="button">Host a rematch</button>':''}<button class="btn ghost" id="hub" type="button">Showdown menu</button><button class="btn ghost" id="home" type="button">Back to the case board</button></div></section>`;
  m.r.emit('ended',{}).catch(()=>{});
  setTimeout(()=>{SFX.play(myI===0?'fanfare':'stamp');anim(app,'quake');if(myI===0&&st.length>1)confetti()},350);
  const cfg=m.cfg;const a=$('#again');if(a)a.onclick=()=>hostMatch(cfg.scope,cfg.n);
  bindChat('match');$('#hub').onclick=()=>go(showdown);$('#home').onclick=()=>go(office);topstats();
}

// ===== Exam room, mock exam (CBE style), senior cases, weak-topic report, flashcards =====
const TODAY=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function prepQ(q,id){if(q.t==='m'){const tf=q.o.length===2&&q.o[0]==='True';const ord=tf?[0,1]:shuffle(q.o.map((_,j)=>j));return{t:'m',q:q.q,o:ord.map(j=>q.o[j]),a:ord.indexOf(q.a),e:q.e,id}}return Object.assign({},q,{id})}
function instB(cd){const g=cd.gen();return{id:cd.id,title:cd.title,chs:cd.chs,scen:g.scen,qs:g.qs.map((q,k)=>prepQ(q,`${cd.chs[0]}x${cd.id}q${k}`))}}
function secStat(sec,got,tot){S.sec=S.sec||{};const a=S.sec[sec]||[0,0];a[0]+=got;a[1]+=tot;S.sec[sec]=a}
const chUnlockedFor=chs=>chs.every(c=>S.stars[c]);
function seniorList(){return[...SECB.map(c=>({kind:'B',c})),...SECC.map(c=>({kind:'C',c}))]}

// ---------- senior cases on the board ----------
function seniorHTML(){
  return `<section class="act"><div class="act-head"><span class="num">★</span><h2>Senior cases</h2><span class="muted">Exam Sections B and C · unlock by closing the chapters each case covers</span></div><div class="folders">${seniorList().map(({kind,c},i)=>{const open=chUnlockedFor(c.chs),st=(S.senior||{})[c.id]||0;
    return `<button class="folder rise sen ${st?'done':''}" style="--d:${i*25}ms" data-sen="${kind}:${c.id}" data-tab="SECTION ${kind} · ${kind==='B'?'10':'20'} MARKS" ${open?'':'disabled'} type="button"><span class="ft">${esc(c.title)}</span><span class="fc">Chapters ${c.chs.join(', ')}</span><span class="fs"><span class="stars">${[1,2,3].map(j=>`<span class="${j<=st?'on':''}">★</span>`).join('')}</span><span>${open?(st?'Replay':'Open'):'Locked'}</span></span></button>`}).join('')}</div></section>`;
}
function bindSenior(){app.querySelectorAll('[data-sen]').forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.sen.split(':');if(k==='B')go(()=>seniorB(SECB.find(c=>c.id===id)));else go(()=>seniorC(SECC.find(c=>c.id===id),'guided',true))})}
function scenBox(html,open){return `<details class="scen" ${open?'open':''}><summary>Scenario</summary><div class="scen-body">${html}</div></details>`}

function seniorB(cd){
  const inst=instB(cd);run={mode:'senior',clues:0,streak:0,maxStreak:0,xp:0,pressure:0,qi:0,score:0,cd,inst};seniorBQ();
}
function seniorBQ(){
  const r=run,q=r.inst.qs[r.qi];
  app.innerHTML=`<div class="casehead"><div><div class="eyebrow">Senior case · Section B · ${esc(r.inst.title)}</div><h1 style="font-size:clamp(28px,5vw,42px)">${esc(r.inst.title)}</h1></div><button class="btn ghost" id="back" type="button">Leave case</button></div>
   ${scenBox(r.inst.scen,true)}<div class="sheet slidein" id="qbox" style="margin-top:14px"></div>`;
  $('#back').onclick=()=>go(office);
  askQ($('#qbox'),q,{label:`Question ${r.qi+1} of 5 · 2 marks`,clues:false,combo:true,
    onAnswer:(ok,_c,el)=>{record(q.id,ok);if(ok){r.score+=2;onCorrect(el,20,false)}else onWrong(el);save()},
    onNext:()=>{if(r.qi<4){r.qi++;go(seniorBQ)}else go(seniorDone)}});

function seniorDone(){
  const r=run,tot=r.inst?10:20,got=r.score,pct=got/tot,st=pct>=.9?3:pct>=.7?2:pct>=.5?1:0,id=(r.cd||{}).id;
  S.senior=S.senior||{};if(st)S.senior[id]=Math.max(S.senior[id]||0,st);secStat(r.inst?'B':'C',got,tot);S.xp+=r.xp+st*30;save();
  doneScreen(`${got}/${tot} MARKS`,pct>=.5,`<div class="stars" style="font-size:34px">${[1,2,3].map(k=>`<span class="${k<=st?'on':''}">★</span>`).join('')}</div><p class="typed" style="max-width:52ch;font-size:17px">${pct>=.5?'Senior case closed. That’s exam-standard work.':'Below the 50% pass mark. Review the explanations and try again; the numbers will change.'}</p><p class="muted">+${r.xp+st*30} XP</p>`,
    `<button class="btn red" id="again" type="button">Try a new version</button><button class="btn ghost" id="home" type="button">Back to the case board</button>`);
  const cd=r.cd,isB=!!r.inst,mode=r.cmode;$('#again').onclick=()=>go(()=>isB?seniorB(cd):seniorC(cd,mode,true));run={mode:'done'};topstats();
}

// ---------- Section C in game style (guided or exam pro-forma, with feedback) ----------
function fieldRow(f,i,pref){return `<div class="pf-row"><label for="${pref}${i}">${esc(f.label)}${f.marks?` <span class="mk">${f.marks} mark${f.marks>1?'s':''}</span>`:''}</label><input class="numin pf-in" id="${pref}${i}" inputmode="decimal" autocomplete="off" placeholder="$000"><div class="pf-fb" id="${pref}fb${i}"></div></div>`}
function markFields(fields,pref){let got=0,tot=0;fields.forEach((f,i)=>{const inp=$('#'+pref+i),v=parseNum(inp.value),ok=v!==null&&Math.abs(v-f.a)<=f.tol;tot+=f.marks;if(ok)got+=f.marks;inp.disabled=true;inp.classList.add(ok?'ok':'no');
  $('#'+pref+'fb'+i).innerHTML=ok?`<span class="good">✓ ${f.marks?f.marks+' mark'+(f.marks>1?'s':''):'Correct'}</span>`:`<span class="bad">✗ Answer: ${fmt(f.a)}</span> <span class="muted">${esc(f.e||'')}</span>`});return[got,tot]}
function seniorC(cd,mode,senior){
  const g=cd.gen();run={mode:'senior',clues:0,streak:0,maxStreak:0,xp:0,pressure:0,cd,g,cmode:mode,step:0,score:0};
  if(cd.kind==='interp')return interpStep();
  run.steps=mode==='guided'?[...g.workings.map(w=>({w})),{pf:1}]:[{pf:1}];cStep();
}
function cHead(){const r=run;return `<div class="casehead"><div><div class="eyebrow">Section C · 20 marks · ${r.cmode==='guided'?'guided workings':'exam pro-forma'}</div><h1 style="font-size:clamp(28px,5vw,42px)">${esc(r.cd.title)}</h1></div><button class="btn ghost" id="back" type="button">Leave</button></div>${scenBox(r.g.scen,true)}`}
function cStep(){
  const r=run,s=r.steps[r.step];
  if(s.w){app.innerHTML=`${cHead()}<div class="sheet slidein stack" style="margin-top:14px"><div class="eyebrow">Step ${r.step+1} of ${r.steps.length}</div><h3>${esc(s.w.title)}</h3>${s.w.fields.map((f,i)=>fieldRow(f,i,'w')).join('')}<div class="row"><button class="btn red" id="chk" type="button">Check working</button></div></div>`;
    $('#back').onclick=()=>go(office);$('#chk').onclick=()=>{const[got,tot]=markFields(s.w.fields.map(f=>Object.assign({},f,{marks:1})),'w');s.w.fields.forEach((f,i)=>record(`${r.cd.chs[0]}x${r.cd.id}w${r.step}_${i}`,$('#w'+i).classList.contains('ok')));got===tot?onCorrect($('#chk'),10,false):onWrong($('#chk'));r.xp+=got*5;$('#chk').outerHTML='<button class="btn" id="nx" type="button">Next step</button>';$('#nx').onclick=()=>{r.step++;go(cStep)}};

// ---------- spaced flashcards ----------
const FC_INT=[0,1,3,7,14,30,60,120];
function fcDeck(){const d=[];LEVELS.forEach((l,i)=>{if(!unlocked(i))return;l.formulas.forEach((f,k)=>d.push({id:`f${l.ch}_${k}`,ch:l.ch,front:f[0],back:esc(f[1]),kind:'Formula'}));l.cards.forEach((c,k)=>d.push({id:`e${l.ch}_${k}`,ch:l.ch,front:c[0],back:c[1],kind:'Concept'}))});return d}
function fcDue(){S.fc=S.fc||{};const t=TODAY(),deck=fcDeck();const due=deck.filter(c=>S.fc[c.id]&&S.fc[c.id].d<=t);const fresh=deck.filter(c=>!S.fc[c.id]);const nd=S.fcNew&&S.fcNew.day===t?S.fcNew.n:0;return{due,fresh:fresh.slice(0,Math.max(0,10-nd)),deck}}
function flashcards(){
  run=null;const{due,fresh,deck}=fcDue();const q=shuffle(due).concat(fresh);
  run={mode:'fc',q,done:0,again:0,startN:q.length};
  if(!q.length){app.innerHTML=`<div class="casehead"><div><div class="eyebrow">Spaced review</div><h1 style="font-size:clamp(32px,6vw,48px)">Flashcards</h1></div><button class="btn ghost" id="back" type="button">Back to the case board</button></div><div class="sheet stack" style="margin-top:18px"><h3>All caught up</h3><p>No cards are due today. You have ${deck.length} cards from your unlocked chapters, and new chapters add more. Come back tomorrow.</p></div>`;$('#back').onclick=()=>go(office);return}
  fcCard();
}
function fcCard(){
  const r=run,c=r.q[0];if(!c){S.xp+=r.done*3;save();doneScreen(`${r.done} REVIEWED`,true,`<p>Nice work. Cards you found easy come back less often. +${r.done*3} XP</p>`,`<button class="btn ghost" id="home" type="button">Back to the case board</button>`);run={mode:'done'};return}
  const st=(S.fc||{})[c.id];
  app.innerHTML=`<div class="casehead"><div><div class="eyebrow">Spaced review · ${r.q.length} left · Ch ${c.ch} · ${c.kind}${st?'':' · NEW'}</div><h1 style="font-size:clamp(32px,6vw,48px)">Flashcards</h1></div><button class="btn ghost" id="back" type="button">Stop</button></div>
   <div class="fcard" id="fcard"><div class="fface front"><div class="eyebrow">${esc(c.kind)}</div><h2>${esc(c.front)}</h2><p class="muted">Recall it, then flip.</p></div><div class="fface back"><div class="eyebrow">${esc(c.front)}</div><div class="fb-body">${c.back}</div></div></div>
   <div class="row" id="fctl" style="justify-content:center;margin-top:16px"><button class="btn red" id="flip" type="button">Show answer</button></div>`;
  $('#back').onclick=()=>{save();go(office)};
  $('#flip').onclick=()=>{$('#fcard').classList.add('flipped');SFX.play('flip');
    $('#fctl').innerHTML=['Again','Hard','Good','Easy'].map((g,k)=>`<button class="btn ${k===2?'red':'ghost'}" data-g="${k}" type="button">${g}</button>`).join('');
    app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g,t=TODAY();S.fc=S.fc||{};const cur=S.fc[c.id]||{b:0,d:t};
      if(!S.fc[c.id]){S.fcNew=S.fcNew&&S.fcNew.day===t?S.fcNew:{day:t,n:0};S.fcNew.n++}
      let nb=g===0?0:g===1?Math.max(1,cur.b):g===2?cur.b+1:cur.b+2;nb=Math.min(nb,FC_INT.length-1);
      S.fc[c.id]={b:nb,d:t+(g===0?0:g===1?1:FC_INT[nb])};r.q.shift();if(g===0)r.q.push(c);else r.done++;save();fcCard()})};
}

go(office);

</script>
